<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E0A16">
<title>Dandiya Nights · Picapool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* night: sign-up stage */
  --night:#1E0A16; --night-2:#38121F; --on-night:#FFF4E8; --on-night-soft:#D9C4C4;
  /* day: inside the app */
  --cream:#FAF5EE; --paper:#FFFDF9; --line:#EADDD1; --line-2:#DCCABC;
  --ink:#2E1A22; --ink-2:#5A4048; --muted:#8E7B72;
  --wine:#5A1E33; --wine-2:#7A2B45; --wine-soft:#F6E9EC;
  --accent:#B9531C;            /* Picapool orange, deepened to read on cream */
  --orange:#FF6B22;            /* Picapool brand, used on dark */
  --marigold:#F2B25C;
  --ok:#2F9E62; --err:#B3261E;
  --serif:"DM Serif Display", Georgia, "Times New Roman", serif;
  --sans:Figtree, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease:cubic-bezier(.2,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#0F060B;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;padding-bottom:20px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
img{display:block}
:focus-visible{outline:2px solid var(--marigold);outline-offset:2px}

/* review bar (desktop only) */
.review{width:100%;max-width:1120px;padding:14px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.review p{color:#CDB9B5;font-size:13px}
.review p b{color:#fff;font-weight:600}
.review nav{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.review nav button{font-size:12px;padding:6px 11px;border-radius:99px;background:#1F1017;color:#CDB9B5;border:1px solid rgba(255,255,255,.07)}
.review nav button:hover{background:#2A1620}
.review nav button[aria-current]{background:var(--paper);color:var(--wine);font-weight:600}
.device{position:relative;width:393px;height:min(852px,calc(100dvh - 120px));min-height:640px;border-radius:44px;overflow:hidden;background:var(--cream);box-shadow:0 0 0 10px #1B0E14,0 30px 80px rgba(0,0,0,.6);flex-shrink:0}
@media (max-width:520px){
  .review{display:none}
  body{background:var(--night);padding:0;overflow:hidden}
  .device{width:100%;height:100dvh;min-height:0;border-radius:0;box-shadow:none}
}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;animation:fadein .3s ease both}
@keyframes fadein{from{opacity:0}}
.scroll{flex:1;overflow-y:auto;scrollbar-width:none;min-height:0}
.scroll::-webkit-scrollbar{display:none}

/* buttons */
.btn{width:100%;min-height:54px;border-radius:14px;background:var(--wine);color:#FFF4E8;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .2s,transform .12s,opacity .2s}
.btn:hover{background:#4A1729}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.38;cursor:default;transform:none}
.btn.light{background:var(--paper);color:var(--ink);border:1px solid var(--line-2)}
.btn.glow{background:var(--orange);color:#1F0B02}
.btn.glow:hover{background:#F25F17}
.text-btn{min-height:44px;color:var(--muted);font-size:14px;font-weight:600}
.text-btn u{text-underline-offset:3px}

/* ================= SPLASH ================= */
.splash{background:radial-gradient(120% 70% at 50% 0%,#5B1C36 0%,var(--night) 58%);color:var(--on-night);align-items:center;text-align:center;padding:20px 24px calc(18px + env(safe-area-inset-bottom))}
.splash::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-conic-gradient(from 0deg at 50% 26%,rgba(242,178,92,.06) 0 2deg,transparent 2deg 14deg);-webkit-mask:radial-gradient(circle at 50% 26%,#000 0,transparent 55%);mask:radial-gradient(circle at 50% 26%,#000 0,transparent 55%)}
.splash .brand{height:24px;width:auto;margin-top:6px;position:relative}
.arch{width:212px;height:236px;margin:18px auto 0;position:relative;flex-shrink:0}
.chip-night{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 13px;border-radius:99px;border:1px solid rgba(242,178,92,.35);background:rgba(255,244,232,.06);font-size:12.5px;font-weight:600;color:var(--on-night-soft);margin-top:20px;position:relative}
.chip-night i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.splash h1{font-family:var(--serif);font-weight:400;font-size:38px;line-height:1.08;letter-spacing:-.01em;margin-top:14px;position:relative}
.splash h1 em{display:block;color:var(--marigold)}
.splash .sub{color:var(--on-night-soft);font-size:15px;line-height:1.5;margin-top:10px;max-width:310px;position:relative}
.assure{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin-top:auto;padding-top:18px;position:relative}
.assure li{list-style:none;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;line-height:1.35;color:var(--on-night-soft)}
.assure span{width:32px;height:32px;border-radius:50%;border:1px solid rgba(242,178,92,.4);display:grid;place-items:center;color:var(--marigold)}
.splash .btn{margin-top:18px;position:relative}
.splash .text-btn{color:var(--on-night-soft);position:relative}
.splash .text-btn b{color:var(--on-night)}

/* ================= ONBOARDING ================= */
.ob{background:radial-gradient(110% 60% at 50% 0%,#5B1C36 0%,var(--night) 62%)}
.crowd{flex:1;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:20px 0 16px;position:relative}
.faces{position:relative;width:260px;height:118px}
.face{position:absolute;left:50%;top:6px;width:76px;height:100px;margin-left:-38px;border-radius:14px;background:#5B1C36 center/cover;filter:blur(4px) saturate(1.2);opacity:.9;border:1px solid rgba(255,244,232,.18);
  transform:translateX(calc((var(--i) - 2) * 54px)) rotate(calc((var(--i) - 2) * 8deg)) scale(calc(1 - (var(--i) - 2) * (var(--i) - 2) * .07));
  z-index:calc(5 - (var(--i) - 2) * (var(--i) - 2));animation:float 4.6s ease-in-out infinite;animation-delay:calc(var(--i) * -.9s)}
@keyframes float{50%{translate:0 -6px}}
.live{margin-top:14px;display:inline-flex;align-items:center;gap:8px;padding:8px 15px;border-radius:99px;background:rgba(255,244,232,.08);border:1px solid rgba(242,178,92,.35);color:var(--on-night);font-size:13px}
.live b{font-family:var(--serif);font-weight:400;font-size:18px;color:var(--marigold);font-variant-numeric:tabular-nums}
.live i{width:8px;height:8px;border-radius:50%;background:#4ADE80}
.card{background:var(--paper);border-radius:28px 28px 0 0;padding:14px 22px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(0,0,0,.35);max-height:74%;overflow-y:auto;scrollbar-width:none;flex-shrink:0;animation:rise .5s var(--ease) both}
.card::-webkit-scrollbar{display:none}
@keyframes rise{from{transform:translateY(24px);opacity:.4}}
.card-top{display:flex;align-items:center;justify-content:space-between;min-height:40px;margin-bottom:6px}
.back{width:40px;height:40px;border-radius:50%;background:#F4EAE1;color:var(--wine);display:grid;place-items:center}
.back:hover{background:#EEDFD3}
.quiet{color:var(--muted);font-size:12.5px;font-weight:600;min-height:40px;padding:0 4px}
.q{animation:qin .38s var(--ease) both}
@keyframes qin{from{opacity:0;transform:translateY(8px)}}
.title{font-family:var(--serif);font-weight:400;color:var(--wine);font-size:31px;line-height:1.1;margin:4px 0 18px}
.title em{display:block;color:var(--accent)}
.choices{display:grid;gap:10px}
.choice{width:100%;min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 12px 18px;border-radius:16px;background:#fff;border:1.5px solid var(--line);text-align:left;transition:border-color .2s,background .2s,transform .12s;animation:qin .4s var(--ease) both;animation-delay:calc(var(--i,0) * 50ms + 60ms)}
.choice:hover{border-color:var(--line-2)}
.choice:active{transform:scale(.985)}
.choice strong{display:block;font-size:16.5px;font-weight:600;color:var(--ink)}
.choice small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.tick{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;color:transparent;flex-shrink:0;transition:all .2s}
.choice[aria-checked=true]{border-color:var(--wine);background:linear-gradient(135deg,#FFF8F2,#FBEDEF)}
.choice[aria-checked=true] .tick{background:var(--wine);border-color:var(--wine);color:#fff}
.note{color:var(--muted);font-size:12px;line-height:1.55;text-align:center;margin-top:14px}
.field{width:100%;height:56px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:0 16px;font-size:17px;outline:none;transition:border-color .2s;color:var(--ink)}
.field:focus{border-color:var(--wine)}
.field::placeholder{color:#B7A79E}
.stack{display:grid;gap:12px}
.phone{display:flex;align-items:center;height:56px;border-radius:14px;border:1.5px solid var(--line);background:#fff;transition:border-color .2s}
.phone:focus-within{border-color:var(--wine)}
.phone span{padding:0 12px 0 16px;font-size:17px;font-weight:600;color:var(--ink-2);border-right:1.5px solid var(--line);height:26px;display:flex;align-items:center}
.phone input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;padding:0 14px;font-size:17px;letter-spacing:.03em}
.phone input::placeholder{color:#B7A79E}
.otp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.otp input{height:64px;border-radius:14px;border:1.5px solid var(--line);background:#fff;text-align:center;font-family:var(--serif);font-size:28px;color:var(--wine);outline:none;transition:all .2s}
.otp input:focus{border-color:var(--wine)}
.otp.ok input{border-color:var(--ok);background:#F1FAF4}
.dob{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:10px}
.dob .field{text-align:center;padding:0 8px}
.age{min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:6px 0}
.age b{font-family:var(--serif);font-weight:400;font-size:52px;line-height:1;color:var(--wine);animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.age small{color:var(--muted);font-size:12px;margin-top:6px}
.err{color:var(--err);font-size:13px;font-weight:600;text-align:center;min-height:18px}
.search{position:relative;margin-bottom:10px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#B7A79E}
.search .field{padding-left:42px;height:48px;font-size:15.5px}
.choices.list{gap:8px}
.choices.list .choice{min-height:52px;padding:10px 14px 10px 16px}
.choices.list .choice strong{font-size:15.5px;font-weight:500}
.nights{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nt{position:relative;padding:12px 10px 10px;border-radius:14px;border:1.5px solid var(--line);background:#fff;text-align:left;transition:all .2s}
.nt b{display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:600}
.nt b i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px rgba(46,26,34,.15)}
.nt small{display:block;color:var(--muted);font-size:12px;margin-top:3px;padding-left:16px}
.nt[aria-pressed=true]{border-color:var(--wine);background:linear-gradient(135deg,#FFF8F2,#FBEDEF)}
.every{margin-top:8px;width:100%;min-height:44px;border-radius:12px;border:1.5px dashed var(--line-2);color:var(--ink-2);font-size:14px;font-weight:600}
.every[aria-pressed=true]{border-style:solid;border-color:var(--wine);color:var(--wine)}
.terms{color:var(--muted);font-size:11.5px;text-align:center;margin-top:10px;line-height:1.5}

/* reveal */
.reveal{background:radial-gradient(110% 70% at 50% 30%,#5B1C36 0%,var(--night) 66%);color:var(--on-night);align-items:center;justify-content:center;text-align:center;padding:24px}
.reveal .faces{width:300px;height:150px}
.reveal .face{width:92px;height:122px;margin-left:-46px;filter:none;opacity:1;border:2px solid var(--paper);transform:translateX(calc((var(--i) - 2) * 62px)) rotate(calc((var(--i) - 2) * 8deg)) scale(calc(1 - (var(--i) - 2) * (var(--i) - 2) * .07));animation:deal .7s var(--ease) both;animation-delay:calc(var(--i) * 70ms)}
@keyframes deal{from{translate:0 40px;opacity:0}}
.reveal h1{font-family:var(--serif);font-weight:400;font-size:36px;line-height:1.1;margin-top:26px}
.reveal h1 b{font-weight:400;color:var(--marigold)}
.reveal h1 em{display:block;color:var(--marigold)}
.reveal p{color:var(--on-night-soft);font-size:15px;margin-top:10px;line-height:1.5;max-width:300px}
.reveal .btn{margin-top:28px}

/* ================= APP (day) ================= */
.app{background:var(--cream)}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px 10px;min-height:62px}
.head .mark{width:30px;height:30px}
.head h1{font-family:var(--serif);font-weight:400;font-size:28px;color:var(--wine);line-height:1}
.tonight{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:99px;background:var(--paper);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.tonight i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2)}
.seg{display:flex;padding:3px;border-radius:12px;background:#F1E7DD;margin:0 18px 12px}
.seg button{flex:1;height:36px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);transition:all .2s;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(90,30,51,.12)}
.deck{flex:1;position:relative;margin:0 18px;min-height:0}
.pc{position:absolute;inset:0;border-radius:20px;overflow:hidden;background:var(--paper);border:1px solid var(--line);box-shadow:0 10px 30px rgba(90,50,40,.10);touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .32s var(--ease),opacity .32s}
.pc.front{cursor:grab}
.pc.behind{transform:scale(.95) translateY(10px);opacity:.6;pointer-events:none}
.pc img{width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.pc .shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 48%,rgba(30,10,22,.55) 70%,rgba(30,10,22,.9))}
.pc .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 18px 20px;color:#fff}
.pc h2{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1}
.pc .col{display:flex;align-items:center;gap:6px;font-size:14px;color:rgba(255,255,255,.88);margin-top:6px}
.pc .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:12.5px;font-weight:600}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tag.same{background:var(--paper);color:var(--wine)}
.pc .line{font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.35;margin-top:12px;color:#FFF4E8}
.pc .sample{position:absolute;top:12px;left:12px;font-size:10.5px;font-weight:700;letter-spacing:.08em;padding:4px 8px;border-radius:6px;background:rgba(30,10,22,.5);color:rgba(255,255,255,.85)}
.stamp{position:absolute;top:22px;padding:4px 12px;border-radius:8px;border:2.5px solid;font-family:var(--serif);font-size:22px;opacity:0;background:rgba(30,10,22,.25)}
.stamp.yes{left:16px;color:var(--marigold);border-color:var(--marigold);transform:rotate(-8deg)}
.stamp.no{right:16px;color:#fff;border-color:#fff;transform:rotate(8deg)}
.actions{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px auto 12px;padding:7px 10px;border-radius:40px;background:var(--paper);border:1px solid var(--line);box-shadow:0 6px 22px rgba(90,48,35,.10);flex-shrink:0}
.actions span{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--muted)}
.round{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;transition:transform .12s}
.round:active{transform:scale(.92)}
.round.skip{background:#F4EAE1;color:var(--ink-2)}
.round.pair{background:var(--wine);color:var(--marigold)}
.round:disabled{opacity:.35}
.empty{position:absolute;inset:0;border-radius:20px;border:1.5px dashed var(--line-2);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:28px}
.empty h2{font-family:var(--serif);font-weight:400;font-size:26px;color:var(--wine);line-height:1.15}
.empty h2 em{display:block;color:var(--accent)}
.empty p{color:var(--muted);font-size:14px;line-height:1.5}
.empty .btn{max-width:250px;margin-top:6px}
.bottom-cta{padding:0 18px calc(14px + env(safe-area-inset-bottom));flex-shrink:0}
.bottom-cta small{display:block;text-align:center;color:var(--muted);font-size:12px;margin-top:8px}
.tabs{display:flex;justify-content:space-around;align-items:center;border-top:1px solid var(--line);background:rgba(255,252,248,.96);padding:4px 10px calc(4px + env(safe-area-inset-bottom));flex-shrink:0}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:64px;min-height:56px;font-size:10.5px;font-weight:600;color:#B09784;position:relative}
.tabs button[aria-current]{color:var(--wine)}
.badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center}

/* lists */
.pad{padding:0 18px 18px}
.hint{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12.5px;margin:2px 0 12px}
.row{display:flex;gap:13px;padding:14px;border-radius:16px;background:var(--paper);border:1px solid var(--line);margin-bottom:10px}
.row>img{width:56px;height:56px;border-radius:50%;object-fit:cover;flex-shrink:0}
.row .m{flex:1;min-width:0}
.row b{font-size:16px;font-weight:600;color:var(--ink)}
.row small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.row .both{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-top:6px}
.row .both i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.row .acts{display:flex;gap:8px;margin-top:10px}
.sb{height:38px;padding:0 14px;border-radius:10px;font-size:13.5px;font-weight:600;background:#F4EAE1;color:var(--ink)}
.sb.pri{background:var(--wine);color:#FFF4E8}
.status{font-size:12.5px;font-weight:600;color:var(--accent);margin-top:6px}
.nothing{text-align:center;color:var(--muted);font-size:14px;line-height:1.5;padding:40px 16px}
.nothing .btn{margin-top:16px}

/* board */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;margin:18px 0 6px}
.pod{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.pod .cr{height:20px;color:#C9962F}
.pod .av{width:66px;height:66px;border-radius:50%;padding:3px;background:var(--line)}
.pod.first .av{width:86px;height:86px;background:linear-gradient(135deg,#E9B65A,#C9962F)}
.pod .av img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--paper)}
.pod b{font-size:14.5px;font-weight:600;margin-top:8px}
.pod small{font-size:11.5px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .base{width:100%;margin-top:10px;border-radius:12px 12px 0 0;background:#F1E7DD;display:grid;place-items:center;font-family:var(--serif);font-size:22px;color:var(--muted)}
.pod.first .base{height:78px;background:linear-gradient(180deg,#F6E3C4,#F1E7DD);color:#A87A20;font-size:28px}
.pod.second .base{height:58px}.pod.third .base{height:44px}
.rk{display:flex;align-items:center;gap:14px;padding:11px 4px;border-bottom:1px solid var(--line)}
.rk .n{width:20px;text-align:center;color:var(--muted);font-weight:600}
.rk img{width:42px;height:42px;border-radius:50%;object-fit:cover}
.rk b{display:block;font-size:15px;font-weight:600}
.rk small{color:var(--muted);font-size:12.5px}
.mine{margin-top:16px;padding:16px;border-radius:16px;background:var(--paper);border:1px solid #EBD3A6}
.mine b{font-family:var(--serif);font-weight:400;font-size:20px;color:var(--wine)}
.mine p{color:var(--muted);font-size:13px;margin-top:4px;line-height:1.5}

/* profile */
.me{border-radius:20px;overflow:hidden;background:var(--paper);border:1px solid var(--line)}
.me .ph{position:relative;height:300px}
.me .ph img{width:100%;height:100%;object-fit:cover}
.me .ph .shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(30,10,22,.85))}
.me .ph .cap{position:absolute;left:18px;right:18px;bottom:16px;color:#fff}
.me .ph h2{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1}
.me .ph p{font-size:14px;color:rgba(255,255,255,.88);margin-top:6px}
.me .nightsrow{display:flex;flex-wrap:wrap;gap:6px;padding:14px 16px}
.me .nightsrow span{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:99px;background:#F4EAE1;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.me .nightsrow i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 2px;border-bottom:1px solid var(--line)}
.set b{display:block;font-size:15px;font-weight:600}
.set small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.edit{height:34px;padding:0 14px;border-radius:99px;background:#F4EAE1;font-size:13px;font-weight:600;flex-shrink:0}
.switch{position:relative;width:48px;height:28px;flex-shrink:0}
.switch input{position:absolute;inset:0;opacity:0;z-index:1;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:99px;background:var(--line-2);transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s var(--ease)}
.switch input:checked+i{background:var(--wine)}
.switch input:checked+i::after{transform:translateX(20px)}
.danger{width:100%;min-height:50px;border-radius:14px;background:#FBEDEC;color:var(--err);font-weight:600;font-size:15px;margin-top:22px}

/* sheets & toast */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(30,10,22,.45);display:flex;align-items:flex-end;animation:fadein .2s both}
.sheet{width:100%;background:var(--paper);border-radius:26px 26px 0 0;padding:10px 22px calc(20px + env(safe-area-inset-bottom));text-align:center;animation:up .34s var(--ease) both;max-height:92%;overflow:auto}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line-2);margin:0 auto 18px}
.sheet h2{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.12;color:var(--wine)}
.sheet h2 em{display:block;color:var(--accent)}
.sheet .p{color:var(--ink-2);font-size:14.5px;line-height:1.55;margin:10px auto 18px;max-width:320px}
.sheet .btn+.btn{margin-top:8px}
.duo{display:flex;justify-content:center;margin:4px 0 16px}
.duo img{width:84px;height:104px;border-radius:18px;object-fit:cover;border:3px solid var(--paper);box-shadow:0 8px 20px rgba(90,48,35,.15)}
.duo img:first-child{transform:rotate(-6deg) translateX(8px)}
.duo img:last-child{transform:rotate(6deg) translateX(-8px)}
.sheet label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.sheet textarea{width:100%;border-radius:14px;border:1.5px solid var(--line);padding:12px 14px;font-size:15.5px;line-height:1.45;resize:none;outline:none;background:#fff}
.sheet textarea:focus{border-color:var(--wine)}
.lock{display:flex;align-items:center;justify-content:center;gap:7px;color:var(--muted);font-size:12.5px;margin:10px 0 14px}
.photo-add{width:120px;height:150px;margin:2px auto 16px;border-radius:18px;border:1.5px dashed var(--line-2);display:grid;place-items:center;color:var(--wine);background:#FFF8F2;cursor:pointer;overflow:hidden;position:relative}
.photo-add img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.paired{position:absolute;inset:0;z-index:60;background:radial-gradient(110% 70% at 50% 35%,#5B1C36 0%,var(--night) 66%);color:var(--on-night);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;animation:fadein .25s both}
.paired .pp{display:flex;position:relative}
.paired .pp img{width:118px;height:150px;border-radius:20px;object-fit:cover;border:3px solid var(--paper)}
.paired .pp img:first-child{transform:rotate(-7deg) translateX(12px);animation:l .6s var(--ease) both}
.paired .pp img:last-child{transform:rotate(7deg) translateX(-12px);animation:r .6s var(--ease) both}
@keyframes l{from{transform:rotate(-16deg) translateX(-60px);opacity:0}}
@keyframes r{from{transform:rotate(16deg) translateX(60px);opacity:0}}
.paired .knot{position:absolute;left:50%;top:-26px;transform:translateX(-50%);width:56px;height:56px;border-radius:50%;background:var(--wine);border:2px solid var(--marigold);color:var(--marigold);display:grid;place-items:center;z-index:2;animation:pop .5s cubic-bezier(.2,1.6,.4,1) .4s both}
.paired h2{font-family:var(--serif);font-weight:400;font-size:36px;line-height:1.08;margin-top:30px}
.paired h2 em{display:block;color:var(--marigold)}
.paired p{color:var(--on-night-soft);font-size:15px;line-height:1.5;margin-top:10px;max-width:290px}
.paired .btn{margin-top:26px}
.paired .text-btn{color:var(--on-night-soft)}
.toast{position:absolute;left:16px;right:16px;bottom:90px;z-index:70;background:var(--ink);color:#FFF4E8;border-radius:14px;padding:13px 16px;font-size:14px;font-weight:500;box-shadow:0 12px 30px rgba(0,0,0,.25);animation:t .3s var(--ease) both;display:flex;align-items:center;gap:10px}
@keyframes t{from{transform:translateY(16px);opacity:0}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

/* the splash illustration: an arched window on a Navratri night, with a string of lights in the nine colours and a pair of dandiya sticks */
function archArt() {
  const bulbs = Array.from({length:13}, (_, i) => { const t = i / 12, x = 30 + t * 152, y = 102 + Math.sin(Math.PI * t) * 20; return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2" fill="${NIGHTS[i % 9].hex}"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" fill="${NIGHTS[i % 9].hex}" opacity=".18"/>`; }).join('');
  const stick = (x1, y1, x2, y2, bands) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#E9B04A" stroke-width="7" stroke-linecap="round"/>${bands.map(([t, c]) => { const x = x1 + (x2 - x1) * t, y = y1 + (y2 - y1) * t; return `<circle cx="${x}" cy="${y}" r="3.6" fill="${c}"/>`; }).join('')}`;
  return `<svg class="arch" viewBox="0 0 212 236" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A0C1E"/><stop offset="1" stop-color="#4E1A30"/></linearGradient>
      <clipPath id="win"><path d="M14 236V104C14 52 56 16 106 8c50 8 92 44 92 96v132z"/></clipPath>
    </defs>
    <path d="M14 236V104C14 52 56 16 106 8c50 8 92 44 92 96v132z" fill="url(#sky)"/>
    <g clip-path="url(#win)">
      <circle cx="106" cy="58" r="30" fill="#FFF1DC" opacity=".08"/><circle cx="106" cy="58" r="15" fill="#FFF1DC"/>
      <g fill="#FFF4E8">${[[44,46,1.2],[160,40,1.4],[70,80,1],[150,78,1],[124,30,.9],[88,34,1]].map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" opacity=".7"/>`).join('')}</g>
      <path d="M30 102 Q106 142 182 102" stroke="#F2B25C" stroke-opacity=".5" fill="none"/>
      ${bulbs}
      <ellipse cx="106" cy="226" rx="70" ry="9" fill="#000" opacity=".28"/>
      ${stick(70, 220, 126, 140, [[.12, '#E0343F'], [.2, '#1FA34A'], [.86, '#2F55E0']])}
      ${stick(142, 220, 86, 140, [[.12, '#0E9A8C'], [.2, '#FF6B22'], [.86, '#8A4BE0']])}
    </g>
    <path d="M14 236V104C14 52 56 16 106 8c50 8 92 44 92 96v132" fill="none" stroke="#F2B25C" stroke-width="1.4"/>
    <path d="M4 236V100C4 44 50 6 106 -2c56 8 102 46 102 102v136" fill="none" stroke="#F2B25C" stroke-opacity=".35"/>
  </svg>`;
}

/* ---------- state ---------- */
const S = {
  screen:'splash', name:'', gender:null, phone:'', dob:['', '', ''], college:null, collegeOther:'', nights:[], photos:[],
  pending:[], seen:new Set(), paired:[], asked:[], dismissed:new Set(), peekCount:0, swipes:0, photoAsked:false,
  filter:'mine', pairsTab:'paired', board:null, period:'tonight', inRace:true, onPicapool:false, editing:false, line:'',
};
const others = () => PEOPLE[other(S.gender || 'male')];
const byId = id => [...PEOPLE.female, ...PEOPLE.male].find(p => p.id === id);
const mePhoto = () => S.photos[0] || IMG(ME_SAMPLE[S.gender || 'male'], 400);
const shared = p => (p.nights || []).filter(n => S.nights.includes(n));
const askedYou = () => others().filter(p => p.likesYou && !S.paired.includes(p.id) && !S.dismissed.has(p.id));
const who = (g, n = 2) => g === 'male' ? (n === 1 ? 'guy' : 'guys') : g === 'female' ? (n === 1 ? 'girl' : 'girls') : (n === 1 ? 'person' : 'people');

/* ---------- shell ---------- */
const ORDER = ['splash','name','gender','peek','phone','code','birthday','college','nights','home','pairs','beforechat','sayhi','board','profile'];
const LABELS = ['Splash','Name','Gender','Guest peek','WhatsApp','Code','Birthday','College','Nights','Home','Pairs','Before chat','Say hi','Board','Profile'];
const BACK = {name:'splash', gender:'name', peek:'gender', phone:'peek', code:'phone', birthday:'code', college:'birthday', nights:'college'};
const app = $('#app'), device = $('#device');

function ensureDemo(key) {
  const i = ORDER.indexOf(key);
  if (i >= 2 && !S.name) S.name = 'Aarav';
  if (i >= 3 && !S.gender) S.gender = 'male';
  if (i >= 5 && !S.phone) S.phone = '9876543210';
  if (i >= 8 && !S.college) S.college = S.gender === 'female' ? 'Miranda House' : 'Hansraj College';
  if (i >= 9 && !S.nights.length) S.nights = upcoming().slice(1, 3).map(n => n.id);
  if (i >= 9 && !S.photos.length) S.photos = [IMG(ME_SAMPLE[S.gender], 500)];
  if (i >= 9) S.photoAsked = true;
  if (i >= 10 && !S.paired.length) {
    others().filter(p => p.likesYou).slice(0, 2).forEach(p => { S.paired.push(p.id); S.seen.add(p.id); });
    if (S.paired[1]) byId(S.paired[1]).numberAsked = true;
  }
}
function go(key) {
  closeSheet(true); $('.paired', device)?.remove();
  if (key === 'beforechat' || key === 'sayhi') {
    S.screen = 'pairs'; S.pairsTab = 'paired'; render();
    const p = byId(S.paired[0]);
    key === 'beforechat' ? (S.onPicapool = false, beforeChat(p)) : sayHi(p);
    mark(key); return;
  }
  S.screen = key; render(); mark(key);
}
function render() {
  const sc = SCREENS[S.screen];
  app.innerHTML = sc.html();
  const r = app.firstElementChild;
  $$('[data-back]', r).forEach(b => b.onclick = () => { if (S.editing) { S.editing = false; return go('profile'); } go(BACK[S.screen] || 'splash'); });
  $$('[data-tab]', r).forEach(b => b.onclick = () => go(b.dataset.tab));
  sc.bind?.(r);
  const af = $('[data-autofocus]', r);
  if (af && matchMedia('(hover:hover)').matches) setTimeout(() => af.focus({preventScroll:true}), 120);
}
function mark(key) { $$('#jump button').forEach(b => b.toggleAttribute('aria-current', b.dataset.k === key)); }

/* onboarding frame: live crowd on top, one question on a cream card */
function crowd() {
  const g = S.gender ? other(S.gender) : null;
  const list = g ? PEOPLE[g] : [...PEOPLE.female.slice(0, 3), ...PEOPLE.male.slice(0, 2)];
  const count = g ? (g === 'female' ? 184 : 211) : 395;
  return `<div class="crowd"><div class="faces">${list.slice(0, 5).map((p, i) => `<span class="face" style="--i:${i};background-image:url('${IMG(p.img, 200)}')"></span>`).join('')}</div>
    <p class="live" role="status"><i></i><b>${count}</b> ${who(g, count)} from North Campus are going</p></div>`;
}
function obFrame(body, opts = {}) {
  return `<section class="screen ob">${crowd()}
    <div class="card"><header class="card-top">${opts.noBack ? '<span></span>' : `<button class="back" data-back aria-label="Back">${IC.back}</button>`}${opts.right || ''}</header>
    <div class="q">${body}</div></div></section>`;
}
function tabs(cur) {
  const n = askedYou().length;
  const items = [['home', 'Discover', IC.tabDiscover], ['pairs', 'Pairs', IC.sticks(22)], ['board', 'Board', IC.tabBoard], ['profile', 'Profile', IC.tabMe]];
  return `<nav class="tabs" aria-label="Main">${items.map(([k, t, ic]) => `<button data-tab="${k}" ${cur === k ? 'aria-current="page"' : ''}>${ic}${t}${k === 'pairs' && n ? `<span class="badge">${n}</span>` : ''}</button>`).join('')}</nav>`;
}
const tonightChip = () => { const t = tonight(); return `<span class="tonight" style="--c:${t.hex}"><i></i>Night ${nightNo()} · ${t.colour}</span>`; };

/* sheets + toast */
let lastFocus;
function sheet(html, bind) {
  closeSheet(true); lastFocus = document.activeElement;
  const s = document.createElement('div'); s.className = 'scrim';
  s.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  s.onclick = e => { if (e.target === s) closeSheet(); };
  device.appendChild(s); bind?.(s);
  setTimeout(() => ($('[data-autofocus]', s) || $('button,textarea', s))?.focus({preventScroll:true}), 60);
}
function closeSheet(instant) { const s = $('.scrim', device); if (!s) return; s.remove(); if (!instant) lastFocus?.focus?.(); }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('.scrim', device)) closeSheet(); else $('.paired', device)?.remove(); }
  if ((S.screen === 'peek' || S.screen === 'home') && !$('.scrim', device) && !$('.paired', device) && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
    if (e.key === 'ArrowRight') decide(1); if (e.key === 'ArrowLeft') decide(-1);
  }
});
let tt;
function toast(m) { $('.toast', device)?.remove(); clearTimeout(tt); const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.innerHTML = m; device.appendChild(t); tt = setTimeout(() => t.remove(), 2800); }

/* ---------- people deck ---------- */
const PEEK = 5;
function card(p, cls, sample) {
  const tags = p.nights.map(night).filter(n => n.date >= tonight().date).map(n =>
    `<span class="tag${S.nights.includes(n.id) ? ' same' : ''}" style="--c:${n.hex}"><i></i>${n.id === tonight().id ? 'Tonight' : `${n.day} ${dnum(n)}`}</span>`).join('');
  return `<article class="pc ${cls}" data-id="${p.id}" aria-label="${esc(p.name)}, ${esc(p.college)}">
    <img src="${IMG(p.img)}" alt="" draggable="false"><div class="shade"></div>
    ${sample ? '<span class="sample">SAMPLE</span>' : ''}
    <span class="stamp yes">Pair up</span><span class="stamp no">Skip</span>
    <div class="cap"><h2>${esc(p.name)}</h2><p class="col">${IC.cap}${esc(p.college)}</p>
      <div class="tags">${tags}</div>${p.line ? `<p class="line">“${esc(p.line)}”</p>` : ''}</div></article>`;
}
function deckList() {
  if (S.screen === 'peek') return others().slice(0, PEEK).filter(p => !S.seen.has(p.id));
  let l = others().filter(p => !S.seen.has(p.id) && !S.paired.includes(p.id) && !S.asked.includes(p.id));
  if (S.filter === 'mine' && S.nights.length) l = l.filter(p => shared(p).length);
  return l;
}
function drawDeck() {
  const d = $('#deck'); if (!d) return;
  const peek = S.screen === 'peek', list = deckList();
  const done = (peek && S.peekCount >= PEEK) || !list.length;
  $$('.round').forEach(b => b.disabled = done);
  if (done) {
    d.innerHTML = peek
      ? `<div class="empty"><h2>That’s tonight’s top five.<em>Everyone else is inside.</em></h2><p>Make your pass to see everyone going this Navratri. It takes about a minute.</p><button class="btn" id="e1">Make my pass</button></div>`
      : `<div class="empty"><h2>You’ve seen everyone${S.filter === 'mine' ? '<em>on your nights.</em>' : '<em>for now.</em>'}</h2><p>More people join every hour. Bring your friends along.</p><button class="btn" id="e2">${IC.share} Invite friends</button>${S.filter === 'mine' ? '<button class="text-btn" id="e3">Show all nights</button>' : ''}</div>`;
    $('#e1', d) && ($('#e1', d).onclick = () => go('phone'));
    $('#e2', d) && ($('#e2', d).onclick = invite);
    $('#e3', d) && ($('#e3', d).onclick = () => { S.filter = 'all'; render(); });
    return;
  }
  d.innerHTML = (list[1] ? card(list[1], 'behind', peek) : '') + card(list[0], 'front', peek);
  drag($('.pc.front', d));
}
function drag(el) {
  let x0 = null, dx = 0; const yes = $('.stamp.yes', el), no = $('.stamp.no', el);
  el.addEventListener('pointerdown', e => { x0 = e.clientX; dx = 0; el.setPointerCapture(e.pointerId); el.style.transition = 'none'; });
  el.addEventListener('pointermove', e => { if (x0 === null) return; dx = e.clientX - x0; el.style.transform = `translateX(${dx}px) rotate(${dx / 22}deg)`; yes.style.opacity = Math.max(0, Math.min(1, dx / 90)); no.style.opacity = Math.max(0, Math.min(1, -dx / 90)); });
  const end = () => { if (x0 === null) return; x0 = null; el.style.transition = ''; if (Math.abs(dx) > 90) decide(dx > 0 ? 1 : -1); else { el.style.transform = ''; yes.style.opacity = no.style.opacity = 0; } };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}
let busy = false;
function decide(dir) {
  const el = $('.pc.front', device); if (!el || busy) return; busy = true;
  const p = byId(el.dataset.id);
  $(dir > 0 ? '.stamp.yes' : '.stamp.no', el).style.opacity = 1;
  el.style.transition = 'transform .32s cubic-bezier(.45,0,.85,.4), opacity .32s';
  el.style.transform = `translateX(${dir * 460}px) rotate(${dir * 18}deg)`; el.style.opacity = 0;
  const b = $('.pc.behind', device); if (b) { b.style.transform = 'none'; b.style.opacity = 1; }
  setTimeout(() => {
    busy = false; S.seen.add(p.id);
    if (S.screen === 'peek') { S.peekCount++; if (dir > 0) S.pending.push(p.id); drawDeck(); if (S.peekCount >= PEEK) gate(); return; }
    S.swipes++;
    if (dir > 0 && p.likesYou) { S.paired.unshift(p.id); drawDeck(); render(); pairedMoment(p); return; }
    if (dir > 0) S.asked.unshift(p.id);
    drawDeck();
    if (S.swipes === 1 && !S.photoAsked) photoSheet();
  }, 300);
}
function gate() {
  const n = S.pending.length;
  sheet(`<h2>${n ? `Your ${plural(n, 'pick')} ${n === 1 ? 'is' : 'are'} saved.` : 'Want to see everyone?'}<em>Make your pass to send ${n === 1 ? 'it' : n ? 'them' : 'yours'}.</em></h2>
    <p class="p">${n ? 'If they pick you too, you’re paired. It takes about a minute.' : 'Your pass shows you everyone going this Navratri. It takes about a minute.'}</p>
    <button class="btn" id="g1" data-autofocus>Make my pass</button><button class="text-btn" id="g2">Not now</button>`, s => {
    $('#g1', s).onclick = () => go('phone'); $('#g2', s).onclick = () => closeSheet();
  });
}
function photoSheet() {
  S.photoAsked = true;
  sheet(`<h2>Add your photo<em>so they can see you too.</em></h2>
    <p class="p">Nobody can see your pass until you add one. One clear photo is all it takes.</p>
    <label class="photo-add" for="pf" aria-label="Choose a photo">${S.photos[0] ? `<img src="${S.photos[0]}" alt="">` : IC.plus}</label>
    <input type="file" id="pf" accept="image/jpeg,image/png,image/webp" hidden>

    <button class="text-btn" id="psam">Use a sample photo (review build)</button>`, s => {

    $('#pf', s).onchange = e => { const f = e.target.files[0]; if (!f) return; const fr = new FileReader(); fr.onload = () => { S.photos.unshift(fr.result); done(); }; fr.readAsDataURL(f); };
    $('#psam', s).onclick = () => { S.photos.unshift(IMG(ME_SAMPLE[S.gender || 'male'], 500)); done(); };
    $('#ps', s).onclick = () => { closeSheet(); toast(`${IC.check} Your pass is live. People can see you now.`); };
  });
}
function pairedMoment(p) {
  const sh = shared(p).map(night);
  const el = document.createElement('div'); el.className = 'paired'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', `Paired with ${p.name}`);
  el.innerHTML = `<div class="pp"><img src="${mePhoto()}" alt=""><span class="knot">${IC.sticks(26)}</span><img src="${IMG(p.img, 400)}" alt=""></div>

}
function startChat(p) { S.onPicapool ? sayHi(p) : beforeChat(p); }
function beforeChat(p) {

    <h2>One small step<em>before you chat.</em></h2>

function sayHi(p) {

    $('#s1', s).onclick = () => { closeSheet(); p.chatted = true; if (S.screen === 'pairs') render(); toast(`${IC.check} Sent. Your chat with ${esc(p.name)} is open on Picapool.`); };
    $('#s2', s).onclick = () => closeSheet();

function swap(p) {
  sheet(`<h2>Swap numbers<em>with ${esc(p.name)}?</em></h2>

    <button class="btn" id="w1">Share my number</button><button class="text-btn" id="w2">Chat on Picapool instead</button>`, s => {
    $('#w1', s).onclick = () => { closeSheet(); p.numberAsked = true; if (S.screen === 'pairs') render(); toast(`${esc(p.name)} will see it once they say yes too.`); };

function invite() {

code: {

  bind: r => {

birthday: {

    <button class="btn" id="nx" disabled>I’m 18 or older, continue ${IC.arrow}</button>`),
  bind: r => {
    const f = ['#dd', '#mm', '#yy'].map(s => $(s, r)), nx = $('#nx', r), age = $('#age', r);
    const base = '<small>Only to check you’re 18+. Never shown or stored.</small>';
    const ok = () => {
      nx.disabled = true;
      if (!f[0].value || !f[1].value || f[2].value.length < 4) { age.innerHTML = base; return; }
      const [d, m, y] = f.map(i => +i.value), dt = new Date(y, m - 1, d);

      const now = new Date(); let a = now.getFullYear() - y; if (now < new Date(now.getFullYear(), m - 1, d)) a--;

      age.innerHTML = `<b>${a}</b><small>Only to check you’re 18+. Never shown or stored.</small>`; nx.disabled = false;

    f.forEach((inp, i) => {
      inp.oninput = () => { inp.value = inp.value.replace(/\D/g, ''); S.dob[i] = inp.value; if (inp.value.length === inp.maxLength && i < 2) f[i + 1].focus(); ok(); };

  },
},

    const l = askedYou();
    if (!l.length) return `<div class="nothing">When someone picks you before you’ve picked them, they show up here.<button class="btn" data-home>Find people</button></div>`;
    return `<p class="hint">They picked you. Pair up and you’re paired.</p>` + l.map(p => row(p, `<button class="sb pri" data-pu="${p.id}">Pair up</button><button class="sb" data-nf="${p.id}">Not for me</button>`, S.seen.has(p.id) ? '<p class="status" style="color:var(--muted)">You skipped them earlier</p>' : '')).join('');
  }
  if (!S.asked.length) return `<div class="nothing">People you pick show up here until they pick you back.<button class="btn" data-home>Find people</button></div>`;
  return `<p class="hint">Waiting for them to pick you too.</p>` + S.asked.map(byId).map(p => row(p, '')).join('');
}

/* ---------- boot ---------- */
$('#jump').innerHTML = ORDER.map((k, i) => `<button data-k="${k}">${i + 1}. ${LABELS[i]}</button>`).join('');
$$('#jump button').forEach(b => b.onclick = () => { S.editing = false; ensureDemo(b.dataset.k); go(b.dataset.k); });
const start = location.hash.slice(1);
if (ORDER.includes(start) || start === 'reveal') { ensureDemo(start === 'reveal' ? 'nights' : start); go(start); } else go('splash');
</script>
</body>
</html>
