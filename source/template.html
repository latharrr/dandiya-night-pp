<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1E0A16">
<meta name="description" content="Find your Dandiya partner. See who from North Campus is going to garba, pair up and dance together. Free, 18+.">
<meta property="og:title" content="Dandiya Nights · Picapool">
<meta property="og:description" content="Find your Dandiya partner from North Campus.">
<title>Dandiya Nights · Picapool</title>
<link rel="icon" href="__MARK__">
<style>
/* Fonts embedded, no font server needed. DM Serif Display (titles) and Figtree (text), both SIL Open Font License. */
@font-face{font-family:"DM Serif Display";font-weight:400;font-style:normal;font-display:swap;src:url(data:font/woff2;base64,__FONT_DMS__) format("woff2")}
@font-face{font-family:"DM Serif Display";font-weight:400;font-style:italic;font-display:swap;src:url(data:font/woff2;base64,__FONT_DMS_I__) format("woff2")}
@font-face{font-family:Figtree;font-weight:300 900;font-style:normal;font-display:swap;src:url(data:font/woff2;base64,__FONT_FIG__) format("woff2")}
/* Dandiya Nights · build __BUILD__
   Two surfaces: a wine "night" for the welcome and sign-up, calm cream inside the app.
   Colour roles: wine = actions inside the app · Picapool orange = the one big action on night screens · marigold = highlights on night ·
   Navratri night colours = small dots that carry meaning (which day). */
:root{
  --night:#1E0A16; --night-2:#38121F; --on-night:#FFF4E8; --on-night-soft:#D9C4C4;
  --cream:#FAF5EE; --paper:#FFFDF9; --line:#EADDD1; --line-2:#DCCABC;
  --ink:#2E1A22; --ink-2:#5A4048; --muted:#75625A;
  --wine:#5A1E33; --wine-press:#4A1729;
  --accent:#B24F1A; --orange:#FF6B22; --orange-press:#F25F17; --marigold:#F2B25C; --gold:#C9962F;
  --ok:#2F9E62; --err:#B3261E;
  --serif:"DM Serif Display", Georgia, "Times New Roman", serif;
  --sans:Figtree, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease:cubic-bezier(.2,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--night)}
body{color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
input,textarea,select{font:inherit;color:inherit}
img{display:block}
:focus-visible{outline:2px solid var(--marigold);outline-offset:2px}
.app :focus-visible,.card :focus-visible,.sheet :focus-visible{outline-color:var(--wine)}
#app{position:relative;width:100%;max-width:480px;height:100dvh;margin:0 auto;overflow:hidden;background:var(--cream)}
@media (min-width:520px){ body{background:radial-gradient(80% 60% at 50% 0%,#3A1424,var(--night))} #app{box-shadow:0 0 80px rgba(0,0,0,.45)} }
.screen{position:absolute;inset:0;display:flex;flex-direction:column;animation:fadein .3s ease both}
@keyframes fadein{from{opacity:0}}
.scroll{flex:1;overflow-y:auto;scrollbar-width:none;min-height:0;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.is-demo::before{content:"DEMO · sample people · nothing is saved";position:absolute;top:0;left:0;right:0;z-index:90;height:20px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;letter-spacing:.06em;background:#F2B25C;color:#2A1300;pointer-events:none}
.is-demo .screen,.is-demo .paired,.is-demo .sheet-bg{top:20px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* buttons */
.btn{width:100%;min-height:54px;border-radius:14px;background:var(--wine);color:#FFF4E8;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;transition:background .2s,transform .12s,opacity .2s}
.btn:hover{background:var(--wine-press)}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.light{background:var(--paper);color:var(--ink);border:1px solid var(--line-2)}
.btn.light:hover{background:#F6EEE6}
.btn.glow{background:var(--orange);color:#1F0B02}
.btn.glow:hover{background:var(--orange-press)}
.btn.gold{background:linear-gradient(135deg,#E9B65A,#C9962F);color:#2A1A00}
.btn.wa{background:#187A42;color:#fff}
.btn.danger{background:var(--err);color:#fff}
.btn svg{flex-shrink:0}
.text-btn{min-height:44px;color:var(--muted);font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.text-btn b{color:var(--ink)}
.text-btn.full{width:100%}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--wine);animation:spin .8s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* ================= NIGHT: welcome ================= */
.splash{background:radial-gradient(120% 70% at 50% 0%,#5B1C36 0%,var(--night) 58%);color:var(--on-night);align-items:center;text-align:center;padding:calc(18px + env(safe-area-inset-top)) 24px calc(16px + env(safe-area-inset-bottom))}
.splash::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-conic-gradient(from 0deg at 50% 26%,rgba(242,178,92,.06) 0 2deg,transparent 2deg 14deg);-webkit-mask:radial-gradient(circle at 50% 26%,#000 0,transparent 55%);mask:radial-gradient(circle at 50% 26%,#000 0,transparent 55%)}
.splash>*{position:relative}
.brand{height:24px;width:auto;margin-top:4px}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:0}
.heart-art{width:128px;height:116px;flex-shrink:0;color:var(--marigold);filter:drop-shadow(0 0 26px rgba(242,178,92,.28))}
.splash .cta{width:100%}
.chip-night{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 13px;border-radius:99px;border:1px solid rgba(242,178,92,.35);background:rgba(255,244,232,.06);font-size:12.5px;font-weight:600;color:var(--on-night-soft);margin-top:18px}
.chip-night i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.splash h1,.night-title{font-family:var(--serif);font-weight:400;font-size:clamp(32px,9.4vw,38px);line-height:1.08;margin-top:12px}
.splash h1{font-size:clamp(44px,13vw,58px);line-height:1;margin-top:16px;letter-spacing:-.01em}
.splash h1 em,.night-title em{display:block;color:var(--marigold)}
.splash .sub,.night-sub{color:var(--on-night-soft);font-size:15px;line-height:1.5;margin-top:10px;max-width:310px}
.splash .btn{margin-top:16px}
.splash .text-btn{color:var(--on-night-soft)}
.splash .text-btn b{color:var(--on-night)}
@media (max-height:700px){ .heart-art{width:96px;height:88px} .chip-night{margin-top:12px} }
@media (max-height:600px){ .heart-art{display:none} }
.night-page .heart-art{margin-bottom:22px}
.night-page{background:radial-gradient(110% 70% at 50% 30%,#5B1C36 0%,var(--night) 66%);color:var(--on-night);align-items:center;justify-content:center;text-align:center;padding:24px}
.night-page .btn{margin-top:26px}
.night-page .text-btn{color:var(--on-night-soft)}

/* ================= NIGHT + CARD: sign-up ================= */
.ob{background:radial-gradient(110% 60% at 50% 0%,#5B1C36 0%,var(--night) 62%)}
.crowd{flex:1;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:calc(16px + env(safe-area-inset-top)) 0 16px}
.faces{position:relative;width:260px;height:118px}
.face{position:absolute;left:50%;top:6px;width:76px;height:100px;margin-left:-38px;border-radius:14px;background:linear-gradient(160deg,#7A2B45,#3A1424) center/cover;filter:blur(4px) saturate(1.2);opacity:.9;border:1px solid rgba(255,244,232,.18);
  transform:translateX(calc((var(--i) - 2) * 54px)) rotate(calc((var(--i) - 2) * 8deg)) scale(calc(1 - (var(--i) - 2) * (var(--i) - 2) * .07));
  z-index:calc(5 - (var(--i) - 2) * (var(--i) - 2));animation:float 4.6s ease-in-out infinite;animation-delay:calc(var(--i) * -.9s)}
@keyframes float{50%{translate:0 -6px}}
.live{margin-top:14px;display:inline-flex;align-items:center;gap:8px;padding:8px 15px;border-radius:99px;background:rgba(255,244,232,.08);border:1px solid rgba(242,178,92,.35);color:var(--on-night);font-size:13px;min-height:36px}
.live b{font-family:var(--serif);font-weight:400;font-size:18px;color:var(--marigold);font-variant-numeric:tabular-nums}
.live i{width:8px;height:8px;border-radius:50%;background:#4ADE80}
@media (max-height:640px){ .faces{display:none} .crowd{min-height:60px} }
.card{overflow-x:hidden;touch-action:pan-y;background:var(--paper);border-radius:28px 28px 0 0;padding:14px 22px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(0,0,0,.35);max-height:78%;overflow-y:auto;scrollbar-width:none;flex-shrink:0;animation:rise .5s var(--ease) both}
.card::-webkit-scrollbar{display:none}
@keyframes rise{from{transform:translateY(24px);opacity:.4}}
.card-top{display:flex;align-items:center;justify-content:space-between;min-height:40px;margin-bottom:6px}
.back{width:40px;height:40px;border-radius:50%;background:#F4EAE1;color:var(--wine);display:grid;place-items:center;flex-shrink:0}
.back:hover{background:#EEDFD3}
.quiet{color:var(--muted);font-size:12.5px;font-weight:600;min-height:40px;padding:0 4px;display:inline-flex;align-items:center;gap:6px}
.q{animation:qin .38s var(--ease) both}
@keyframes qin{from{opacity:0;transform:translateY(8px)}}
.title{font-family:var(--serif);font-weight:400;color:var(--wine);font-size:clamp(27px,7.6vw,31px);line-height:1.1;margin:4px 0 18px}
.title em{display:block;color:var(--accent)}
.from-pp{margin:-8px 0 14px;font-size:12.5px;color:var(--muted)}
.choices{display:grid;gap:10px}
.choice{width:100%;min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 12px 18px;border-radius:16px;background:#fff;border:1.5px solid var(--line);text-align:left;transition:border-color .2s,background .2s,transform .12s;animation:qin .4s var(--ease) both;animation-delay:calc(var(--i,0) * 40ms + 40ms)}
.choice:hover{border-color:var(--line-2)}
.choice:active{transform:scale(.985)}
.choice strong{display:block;font-size:16.5px;font-weight:600;color:var(--ink)}
.choice small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.tick{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;color:transparent;flex-shrink:0;transition:all .2s}
.choice[aria-checked=true]{border-color:var(--wine);background:linear-gradient(135deg,#FFF8F2,#FBEDEF)}
.choice[aria-checked=true] .tick{background:var(--wine);border-color:var(--wine);color:#fff}
.choices.list{gap:8px}
.choices.list .choice{min-height:52px;padding:10px 14px 10px 16px}
.choices.list .choice strong{font-size:15.5px;font-weight:500}
.note{color:var(--muted);font-size:12px;line-height:1.55;text-align:center;margin-top:14px}
.field{width:100%;height:56px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:0 16px;font-size:17px;outline:none;transition:border-color .2s;color:var(--ink)}
.field:focus{border-color:var(--wine)}
.field::placeholder{color:#958379}
.stack{display:grid;gap:12px}
.phone{display:flex;align-items:center;height:56px;border-radius:14px;border:1.5px solid var(--line);background:#fff;transition:border-color .2s}
.phone:focus-within{border-color:var(--wine)}
.phone span{padding:0 12px 0 16px;font-size:17px;font-weight:600;color:var(--ink-2);border-right:1.5px solid var(--line);height:26px;display:flex;align-items:center}
.phone input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;padding:0 14px;font-size:17px;letter-spacing:.03em}
.phone input::placeholder{color:#958379}
.otp{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:10px;width:100%}
.otp input{height:64px;width:100%;min-width:0;border-radius:14px;border:1.5px solid var(--line);background:#fff;text-align:center;font-family:var(--serif);font-size:28px;color:var(--wine);outline:none;transition:all .2s}
.otp input:focus{border-color:var(--wine)}
.otp.ok input{border-color:var(--ok);background:#F1FAF4}
.dob{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.4fr);gap:10px;width:100%}
.dob .field{text-align:center;padding:0 8px;min-width:0}
.field,.phone input{min-width:0}
.age{min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:6px 0}
.age b{font-family:var(--serif);font-weight:400;font-size:52px;line-height:1;color:var(--wine);animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.age small{color:var(--muted);font-size:12px;margin-top:6px}
.err{color:var(--err);font-size:13px;font-weight:600;text-align:center;min-height:18px;line-height:1.4}
.search{position:relative;margin-bottom:10px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#958379}
.search .field{padding-left:42px;height:48px;font-size:15.5px}
.lead{color:var(--muted);font-size:13.5px;line-height:1.45;margin:-8px 0 12px}
.ev-add{display:flex;gap:8px;margin-top:10px}
.ev-add .field{height:48px;font-size:15.5px}
.ev-add .sb{min-height:48px;flex-shrink:0}
.plan-card{border:1.5px solid var(--wine);border-radius:16px;background:linear-gradient(135deg,#FFF8F2,#FBEDEF);padding:12px 12px 8px 14px;margin-top:10px;animation:qin .35s var(--ease) both}
.plan-card h3{display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:600;color:var(--ink);min-height:32px}
.plan-card h3 span{min-width:0;overflow-wrap:anywhere}
.plan-card h3 button{margin-left:auto;width:36px;height:36px;border-radius:50%;color:var(--muted);display:grid;place-items:center;flex-shrink:0}
.plan-card small{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:8px 0 6px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-right:-12px;padding-right:12px}
.chips::-webkit-scrollbar{display:none}
.chips .pill{min-height:38px;font-size:13px;padding:0 13px;flex-shrink:0;white-space:nowrap}
.need{color:var(--muted);font-size:12.5px;text-align:center;margin-top:10px;min-height:18px}
.label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:18px 0 8px}
.label em{font-style:normal;font-weight:500;color:var(--muted);margin-left:4px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:40px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-size:13.5px;font-weight:600;color:var(--ink-2);transition:all .2s}
.pills.even .pill{flex:1}
.pill[aria-pressed=true]{border-color:var(--wine);color:var(--wine);background:#FBEDEF}
.terms{color:var(--muted);font-size:11.5px;text-align:center;margin-top:10px;line-height:1.5}
.terms a{text-underline-offset:2px}
.lookup{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 0 6px}
.lookup .spinner{margin:6px auto 16px}

/* reveal */
.reveal .faces{width:300px;height:150px}
.reveal .face{width:92px;height:122px;margin-left:-46px;filter:none;opacity:1;border:2px solid var(--paper);transform:translateX(calc((var(--i) - 2) * 62px)) rotate(calc((var(--i) - 2) * 8deg)) scale(calc(1 - (var(--i) - 2) * (var(--i) - 2) * .07));animation:deal .7s var(--ease) both;animation-delay:calc(var(--i) * 70ms)}
@keyframes deal{from{translate:0 40px;opacity:0}}
.reveal .night-title{margin-top:26px}
.reveal .night-title b{font-weight:400;color:var(--marigold)}

/* ================= DAY: the app ================= */
.app{background:var(--cream)}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 18px 10px;min-height:62px;flex-shrink:0}
.head .mark{width:30px;height:30px}
.head h1{font-family:var(--serif);font-weight:400;font-size:28px;color:var(--wine);line-height:1}
.tonight{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:99px;background:var(--paper);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.tonight i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2);flex-shrink:0}
.seg{display:flex;padding:3px;border-radius:12px;background:#F1E7DD;margin:0 18px 10px;flex-shrink:0}
.seg button{flex:1;min-height:36px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);transition:all .2s;white-space:nowrap;padding:0 6px}
.seg button[aria-pressed=true],.seg button[aria-selected=true]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(90,30,51,.12)}
.nudge{margin:0 18px 10px;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:#FFF6E8;border:1px solid #EBD3A6;flex-shrink:0}
.nudge p{flex:1;font-size:13px;line-height:1.4;color:var(--ink-2)}
.nudge p b{color:var(--ink)}
.nudge .sb{flex-shrink:0}
.crownbar{margin:0 18px 10px;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:14px;background:linear-gradient(135deg,#FFF3D6,#F8E2B5);border:1px solid #E8C47A;flex-shrink:0}
.crownbar span{flex:1;font-size:13.5px;font-weight:600;color:#5A3D00;display:flex;align-items:center;gap:7px}
.crownbar .x{width:32px;height:32px;border-radius:50%;color:#8A6A20;display:grid;place-items:center}
.deck{flex:1;position:relative;margin:0 18px;min-height:0}
.pc{position:absolute;inset:0;border-radius:20px;overflow:hidden;background:var(--paper);border:1px solid var(--line);box-shadow:0 10px 30px rgba(90,50,40,.10);touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .32s var(--ease),opacity .32s}
.pc.front{cursor:grab;animation:tofront .26s var(--ease) both}
@keyframes tofront{from{scale:.95;translate:0 10px;opacity:.6}}
.pc.gone{pointer-events:none;z-index:5;animation:none}
.deck{touch-action:none}
.pc.behind{transform:scale(.95) translateY(10px);opacity:.6;pointer-events:none}
.pc .photo{position:absolute;inset:0;background:linear-gradient(160deg,#7A2B45,#3A1424) center 25%/cover}
.pc .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,10,22,.25) 0,transparent 18%,transparent 46%,rgba(30,10,22,.55) 68%,rgba(30,10,22,.92))}
.pc .bars{position:absolute;top:10px;left:14px;right:56px;display:flex;gap:4px;z-index:2}
.pc .bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.4)}
.pc .bars i.on{background:#fff}
.pc .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 18px 20px;color:#fff}
.pc h2{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1}
.pc .col{display:flex;align-items:center;gap:6px;font-size:14px;color:rgba(255,255,255,.88);margin-top:6px}
.pc .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:4px 10px;line-height:1.25;max-width:100%;border-radius:99px;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:12.5px;font-weight:600}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tag.same{background:var(--paper);color:var(--wine)}
.pc .line{margin-top:12px}
.pc .line small{display:block;font-size:11.5px;font-weight:600;letter-spacing:.02em;color:rgba(255,255,255,.7)}
.pc .line p{font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.35;color:#FFF4E8;margin-top:2px}
.pc .sample{position:absolute;top:14px;left:14px;font-size:10.5px;font-weight:700;letter-spacing:.08em;padding:4px 8px;border-radius:6px;background:rgba(30,10,22,.55);color:rgba(255,255,255,.88);z-index:2}
.pc .more{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:50%;background:rgba(30,10,22,.35);color:#fff;display:grid;place-items:center;z-index:3;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

  async req(method, path, body) {
    let res;

      res = await fetch(CONFIG.API_BASE + path, {
        method, headers: {'Content-Type': 'application/json', ...(S.token ? {Authorization: 'Bearer ' + S.token} : {})},
        body: body ? JSON.stringify(body) : undefined,
      });

    if (res.status === 401 && S.token) { S = Object.assign(freshState(), {ref: S.ref, entry: S.entry}); save(); setTimeout(() => go('landing'), 0); throw new Error('Please log in again.'); }

SCREENS.code = () => {
  const L = CONFIG.OTP_LENGTH;
  obFrame(`<h1 class="title">Enter the<em>code.</em></h1>
    <div class="otp" id="otp" style="--n:${L}">${Array.from({length: L}, (_, i) => `<input inputmode="numeric" size="1" maxlength="${i ? 1 : L}" autocomplete="${i ? 'off' : 'one-time-code'}" aria-label="Digit ${i + 1} of ${L}" ${i ? '' : 'data-autofocus'}>`).join('')}</div>
    <p class="err" id="err" role="alert" style="margin-top:10px"></p>
    <p class="note" style="margin-top:4px">Sent ${otpVia === 'sms' ? 'by SMS' : 'on WhatsApp'} to +91 ${fmtPhone(S.phone)}. <button class="text-btn" id="chg" style="min-height:0;font-size:12px"><u>Change</u></button><br>
      <button class="text-btn" id="rs" disabled style="min-height:32px;font-size:12px">Resend in 30s</button>
      ${otpAlt ? `<button class="text-btn" id="alt" disabled style="min-height:32px;font-size:12px" hidden>· <u>${otpAlt === 'sms' ? 'Send by SMS instead' : 'Send on WhatsApp instead'}</u></button>` : ''}
      ${isDemo() ? `<br>Demo: any ${L} digits work.` : ''}</p>`);
  const ins = $$('#otp input'), err = $('#err');
  let busy = false;
  const verify = async () => {
    const code = ins.map(i => i.value).join('');
    if (busy || code.length < L) return; busy = true;
    $('#otp').classList.add('ok'); ins.forEach(i => i.blur());
    try {
      const r = await api.verifyOtp(S.phone, code);
      S.token = r.token; S.user = r.user || null; S.profile = r.profile || null; S.picapool = null;
      if (!r.user && !(S.guest?.genderAt && Date.now() - S.guest.genderAt < 30 * 60e3)) S.askGender = true; // answered on an earlier visit: confirm it
      save();
      track('otp_verified', {existing: !!r.user});
      go(nextStepAfterLogin());
    } catch (e) { busy = false; $('#otp').classList.remove('ok'); err.textContent = e.message; ins.forEach(i => i.value = ''); ins[0].focus(); }
  };
  ins.forEach((inp, i) => {
    inp.oninput = () => {
      err.textContent = '';
      const d = inp.value.replace(/\D/g, '');
      if (d.length > 1) { d.split('').slice(0, L - i).forEach((c, k) => ins[i + k].value = c); ins[Math.min(L - 1, i + d.length - 1)].focus(); }
      else { inp.value = d; if (d && i < L - 1) ins[i + 1].focus(); }
      verify();
    };
    inp.onkeydown = e => { if (e.key === 'Backspace' && !inp.value && i) ins[i - 1].focus(); };
  });
  $('#chg').onclick = () => go('phone');
  let n = 30; const rs = $('#rs');
  const alt = $('#alt');
  const iv = setInterval(() => { if (!document.body.contains(rs)) return clearInterval(iv); if (--n <= 0) { clearInterval(iv); rs.disabled = false; rs.innerHTML = '<u>Resend code</u>'; if (alt) { alt.hidden = false; alt.disabled = false; } } else rs.textContent = `Resend in ${n}s`; }, 1000);
  const resend = async (b, channel) => { rs.disabled = true; if (alt) alt.disabled = true;
    try { const r = await api.sendOtp(S.phone, channel); otpVia = r.via || otpVia; otpAlt = r.alt || null; track('otp_resent', {via: otpVia}); toast(otpVia === 'sms' ? 'Code sent by SMS' : 'Code sent again'); go('code'); }
    catch (e) { err.textContent = e.message; rs.disabled = false; if (alt) alt.disabled = false; } };
  rs.onclick = () => resend(rs, null);
  if (alt) alt.onclick = () => resend(alt, otpAlt);
};

/* ---------- crowns: notice when someone is in tonight's top 20 ---------- */
const myBoardKey = () => S.user?.gender === 'female' ? 'queen' : 'king';
const hasCrown = () => !!(S.crown && S.crown.day === todayISO() && S.profile?.inBoard);
let crownCheckedAt = 0;
async function checkCrown(force) {
  if (!S.user || !S.profile) return;
  if (!S.profile.inBoard) return setCrown(null);
  if (!force && Date.now() - crownCheckedAt < 60e3) return;
  crownCheckedAt = Date.now();
  try { const r = await api.getLeaderboard(myBoardKey(), 'tonight'); setCrown(r.me && r.me.rank ? {rank: r.me.rank, day: todayISO()} : null); } catch (e) {}
}
function setCrown(c) {
  const before = JSON.stringify(S.crown || null); S.crown = c; save();
  if (before === JSON.stringify(c)) return;
  if (c && (!before || before === 'null')) track('crown_earned', {rank: c.rank});
  refreshNav(); renderCrownBar();
}
function renderCrownBar() {
  const el = $('#crownBar'); if (!el) return;

/* Swiping. touch-action:none on the card stops the browser from taking over a slightly diagonal swipe (which used to snap the card back).

function bindCard(el, p) {
  if (!el) return;
  let id = null, sx = 0, sy = 0, dx = 0, dy = 0, moved = false, lastX = 0, lastT = 0, vx = 0;

function decide(el, p, dir) {

async function sendSwipe(p, dir) {

    <button class="btn" id="send">${p.hasPicapool ? 'Send and open chat' : 'Send message'}</button><button class="text-btn" id="cx">Cancel</button>`);
  const paint = () => {
    $$('[data-pn]', s).forEach(b => b.setAttribute('aria-pressed', b.dataset.pn === plan.night));
    $$('[data-pp]', s).forEach(b => b.setAttribute('aria-pressed', b.dataset.pp === plan.place));
    $$('[data-pt]', s).forEach(b => b.setAttribute('aria-pressed', b.dataset.pt === plan.time));
  };
  const planLine = () => {
    if (!plan.on) return '';
    const n = nightByDate(plan.night);
    const bits = [n ? `${n.day} ${+n.date.slice(8)} Oct` : null, plan.place, plan.time].filter(Boolean);
    const meet = ($('#pMeet', s).value || '').replace(/\s+/g, ' ').trim();
    return bits.length || meet ? `\n\nPlan: ${bits.join(', ')}${meet ? `${bits.length ? '. ' : ''}Meet ${meet.replace(/^at /i, 'at ')}` : ''}.` : '';
  };

  $$('[data-pt]', s).forEach(b => b.onclick = () => { plan.time = plan.time === b.dataset.pt ? null : b.dataset.pt; paint(); });
  paint();
  $('#send', s).onclick = () => { const t = ($('#opener', s).value.trim() + planLine()).trim(); if (plan.on) track('plan_sent'); openChat(m, t || null, $('#send', s)); };

/* ---------- pairs: Paired (both picked) · Picked you (they picked me first) · You picked (waiting) ---------- */
let pairsTab = 'paired';

function renderPairsKeepSheet() { const sh = $('.sheet-bg', app); renderPairs(); if (sh) app.appendChild(sh); }
function renderPairs() {
  S.seenMatchIds = [...new Set([...S.seenMatchIds, ...S.matches.map(m => m.id)])]; save();
  const idOf = t => 'tab-' + t;
  app.innerHTML = `${demoFlag()}<section class="screen app">
    <header class="head"><h1>Pairs</h1></header>
    <div class="seg" role="tablist" aria-label="Pairs">${PAIR_TABS.map(([t, l]) => `<button role="tab" id="${idOf(t)}" aria-selected="${pairsTab === t}" aria-controls="pPanel" tabindex="${pairsTab === t ? 0 : -1}">${l}</button>`).join('')}</div>
    <div class="scroll pad" id="pPanel" role="tabpanel" aria-labelledby="${idOf(pairsTab)}">${pairsTab === 'paired' ? pairedHtml() : '<div class="spinner"></div>'}</div>
    ${tabsHtml()}</section>`;
  bindTabs();
  const order = PAIR_TABS.map(x => x[0]);

  order.forEach((t, i) => { const b = $('#' + idOf(t)); b.onclick = () => pick(t);
    b.onkeydown = e => { const k = {ArrowLeft: i - 1, ArrowRight: i + 1, Home: 0, End: order.length - 1}[e.key]; if (k === undefined) return; e.preventDefault(); pick(order[(k + order.length) % order.length]); }; });

}
const bothLine = p => { const sh = shared(p); return sh.length ? `<span class="both"><i style="--c:${nightByDate(sh[0].date)?.hex || '#F2B25C'}"></i>Both going ${esc(sharedText(sh))}</span>` : ''; };
const toDiscover = root => $$('[data-home]', root).forEach(b => b.onclick = () => { tab = 'feed'; go('app'); });
function pairedHtml() {
  if (!S.matches.length) return `<div class="nothing">No pairs yet. When someone you picked picks you back, they show up here.<button class="btn" data-home>Find people</button></div>`;

    const note = !m.chatId && m.chatRequest === 'sent' ? `<p class="status">${esc(p.name)} is reviewing your message request</p>`
      : !m.chatId && m.chatRequest === 'received' ? '<p class="status">Sent you a message request</p>' : m.chatId ? '<p class="status mute">Chat open on Picapool</p>' : '';
    const num = m.numberStatus === 'shared' ? `<a class="sb" href="https://wa.me/91${esc(m.phone)}" target="_blank" rel="noopener">+91 ${esc(fmtPhone(m.phone))}</a>`

async function loadReceived() {

/* ---------- board: Garba Queen / Garba King, tonight and all of Navratri. No public counts. ---------- */
let lb = {board: null, period: 'tonight', prev: {}, timer: null};
async function renderBoard() {
  lb.board ??= myBoardKey();
  app.innerHTML = `${demoFlag()}<section class="screen app">
    <header class="head"><h1>${lb.board === 'queen' ? CONFIG.BOARD_NAME.female : CONFIG.BOARD_NAME.male}</h1>${tonightChip()}</header>
    <div class="seg" role="group" aria-label="Board"><button data-b="queen" aria-pressed="${lb.board === 'queen'}">${CONFIG.BOARD_NAME.female}</button><button data-b="king" aria-pressed="${lb.board === 'king'}">${CONFIG.BOARD_NAME.male}</button></div>
    <div class="scroll pad">
      <div class="seg" role="group" aria-label="When" style="margin:0"><button data-p="tonight" aria-pressed="${lb.period === 'tonight'}">Tonight · ${esc(tonight().colour)}</button><button data-p="week" aria-pressed="${lb.period === 'week'}">All of Navratri</button></div>
      <div id="lbBody"><div class="spinner"></div></div>
    </div>
    ${tabsHtml()}</section>`;
  bindTabs();
  $$('[data-b]').forEach(b => b.onclick = () => { lb.board = b.dataset.b; renderBoard(); });
  $$('[data-p]').forEach(b => b.onclick = () => { lb.period = b.dataset.p; renderBoard(); });
  await loadBoard(false);
  /* live: while the board is open and visible, it refreshes every 15 seconds and shows who moved */
  clearInterval(lb.timer);
  lb.timer = setInterval(() => { if (route !== 'app' || tab !== 'board') return clearInterval(lb.timer); if (!document.hidden && !$('.sheet-bg', app)) loadBoard(true); }, 15000);
}
async function loadBoard(silent) {
  const want = lb.board + lb.period;
  let r; try { r = await api.getLeaderboard(lb.board, lb.period); } catch (e) { if (!silent && $('#lbBody')) $('#lbBody').innerHTML = `<p class="nothing">${esc(e.message)}</p>`; return; }
  if (!$('#lbBody') || want !== lb.board + lb.period) return;
  const prev = lb.prev[want] || {}, ranks = {};
  (r.top || []).forEach((p, i) => ranks[p.id] = i + 1);
  const moved = id => { const was = prev[id], now = ranks[id]; if (!silent || !now) return ''; if (!was) return '<span class="mv up" aria-label="New on the board">new</span>';
    return was > now ? `<span class="mv up" aria-label="Up ${was - now}">▲${was - now}</span>` : was < now ? `<span class="mv down" aria-label="Down ${now - was}">▼${now - was}</span>` : ''; };
  lb.prev[want] = ranks;
  if (lb.period === 'tonight' && lb.board === myBoardKey() && S.profile.inBoard) setCrown(r.me && r.me.rank ? {rank: r.me.rank, day: todayISO()} : null);
  const top = r.top || [];
  const pod = (p, rk) => p ? `<div class="pod p${rk}"><span class="cr">${rk === 1 ? IC.crown : ''}</span><div class="av"><img src="${esc(p.photo)}" alt=""></div><b>${esc(p.name)} ${moved(p.id)}</b><small>${esc(shortCollege(p.college))}</small><div class="base">${rk}</div></div>` : '<div></div>';
  const mine = (S.user.gender === 'female') === (lb.board === 'queen');
  $('#lbBody').innerHTML = (top.length ? `<div class="podium">${pod(top[1], 2)}${pod(top[0], 1)}${pod(top[2], 3)}</div>
      ${top.slice(3).map((p, i) => `<div class="rk"><span class="n">${i + 4}</span><img src="${esc(p.photo)}" alt=""><span style="min-width:0"><b>${esc(p.name)} ${moved(p.id)}</b><small>${esc(p.college)}</small></span>${p.isMe ? '<span class="you">YOU</span>' : ''}</div>`).join('')}`
    : '<p class="nothing">No crowns yet tonight. The first picks decide it.</p>')
    + (mine ? myBoardCard(r.me) : '')
    + `<p class="note"><span class="livedot" aria-hidden="true"></span>Live · updated ${new Date().toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'})}. Counts are never shown publicly.</p>`;
  $('#joinLb') && ($('#joinLb').onclick = () => setBoard(true));
  $('#shareRank') && ($('#shareRank').onclick = () => openShare('rank', r.me.rank, lb.period));
}
function myBoardCard(me) {
  if (!S.profile.inBoard) return `<div class="mine"><b>You’re not in the race.</b><p>The top ${CONFIG.BOARD_SIZE} are crowned every night.</p><button class="btn" id="joinLb">Put me in</button></div>`;
  if (!myPhoto()) return `<div class="mine"><b>Add a photo to join the race.</b><p>Only passes with a photo can be crowned.</p></div>`;
  if (!me) return '';
  return `<div class="mine"><b>${me.rank ? `You’re #${me.rank}.` : `Not in the top ${CONFIG.BOARD_SIZE} yet.`}</b>
    <p>${me.count} ${me.count === 1 ? 'person' : 'people'} picked you ${lb.period === 'tonight' ? 'today' : 'this Navratri'}. Only you see this.</p>
    ${me.rank ? '<button class="btn gold" id="shareRank">Flaunt your crown</button>' : ''}</div>`;

  const g = x.createRadialGradient(W / 2, 0, 0, W / 2, 0, 1500); g.addColorStop(0, '#5B1C36'); g.addColorStop(.6, '#1E0A16'); g.addColorStop(1, '#16070F');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.save(); x.translate(W / 2, 470); x.fillStyle = 'rgba(242,178,92,.05)';
  for (let a = 0; a < 360; a += 12) { x.rotate(12 * Math.PI / 180); x.beginPath(); x.moveTo(0, 0); x.lineTo(-30, -1600); x.lineTo(30, -1600); x.closePath(); x.fill(); }
  x.restore();
  // string of lights in the nine colours
  for (let i = 0; i <= 18; i++) { const tt = i / 18, px = 60 + tt * (W - 120), py = 110 + Math.sin(Math.PI * tt) * 60, col = CONFIG.NIGHTS[i % 9].hex;
    x.fillStyle = hexA(col, .22); x.beginPath(); x.arc(px, py, 20, 0, 7); x.fill(); x.fillStyle = col; x.beginPath(); x.arc(px, py, 9, 0, 7); x.fill(); }
  // logo, cream
  const logo = await loadImg(LOCKUP); const lw = 260, lh = lw * logo.height / logo.width; const lc = document.createElement('canvas'); lc.width = lw; lc.height = lh;
  const lx = lc.getContext('2d'); lx.drawImage(logo, 0, 0, lw, lh); lx.globalCompositeOperation = 'source-in'; lx.fillStyle = '#FFF4E8'; lx.fillRect(0, 0, lw, lh);
  x.drawImage(lc, (W - lw) / 2, 210);
  x.textAlign = 'center';
  if (crown) {
    x.fillStyle = '#D9C4C4'; x.font = F(600, 40); x.fillText(period === 'tonight' ? 'Tonight’s' : 'Navratri’s', W / 2, 360);
    x.fillStyle = '#F2B25C'; fit(boardFor(S.user.gender), n => Sf(n, true), 140, W - 120); x.fillText(boardFor(S.user.gender), W / 2, 490);
  } else {
    x.fillStyle = '#FFF4E8'; fit('Going to garba', n => Sf(n), 104, W - 140); x.fillText('Going to garba', W / 2, 380);
    x.fillStyle = '#F2B25C'; fit('this Navratri.', n => Sf(n, true), 104, W - 140); x.fillText('this Navratri.', W / 2, 490);
  }
  // photo in an arch with a marigold line
  const aw = 560, ah = 680, aX = (W - aw) / 2, aY = 560;
  x.save(); x.shadowColor = 'rgba(0,0,0,.55)'; x.shadowBlur = 60; x.shadowOffsetY = 30; archPath(x, aX, aY, aw, ah); x.fillStyle = '#38121F'; x.fill(); x.restore();
  const ph = await loadImg(myPhoto());
  x.save(); archPath(x, aX, aY, aw, ah); x.clip(); cover(x, ph, aX, aY, aw, ah); x.restore();
  x.lineWidth = 6; x.strokeStyle = '#F2B25C'; archPath(x, aX - 14, aY - 14, aw + 28, ah + 28, 40); x.stroke();
  let y = aY + ah;
  if (crown) {
    const mr = 84; x.fillStyle = '#1E0A16'; x.beginPath(); x.arc(W / 2, y, mr + 10, 0, 7); x.fill();
    const gg = x.createLinearGradient(0, y - mr, 0, y + mr); gg.addColorStop(0, '#F6D58C'); gg.addColorStop(1, '#C9962F');
    x.fillStyle = gg; x.beginPath(); x.arc(W / 2, y, mr, 0, 7); x.fill();
    x.fillStyle = '#2A1A00'; x.font = Sf(84); x.textBaseline = 'middle'; x.fillText('#' + rank, W / 2, y + 4); x.textBaseline = 'alphabetic';
    y += mr + 100;
  } else y += 120;
  x.fillStyle = '#FFF4E8'; fit(S.user.firstName, n => Sf(n), 96, W - 160); x.fillText(S.user.firstName, W / 2, y);
  y += 62; x.fillStyle = '#D9C4C4'; fit(S.user.college, n => F(500, n), 40, W - 160); x.fillText(S.user.college, W / 2, y);
  const ev = !crown && livePlans(S.profile)[0];
  if (ev) { y += 58; x.fillStyle = '#F2B25C'; fit(ev.name, n => F(600, n), 40, W - 200); x.fillText(ev.name, W / 2, y); y += 76; } else y += 90;
  const ns = crown ? [t] : upcomingDates(S.profile).map(nightByDate).filter(Boolean).slice(0, 6);
  const step = 140; let sx = W / 2 - (ns.length - 1) * step / 2; x.font = F(600, 30);
  ns.forEach(n => { x.fillStyle = n.hex; x.beginPath(); x.arc(sx, y, 16, 0, 7); x.fill(); x.fillStyle = '#FFF4E8'; x.fillText(crown ? `${n.day} · ${n.colour}` : n.day, sx, y + 54); sx += step; });
  x.fillStyle = '#D9C4C4'; x.font = F(500, 34); x.fillText('Find your Dandiya partner', W / 2, H - 252);
  x.fillStyle = '#FF8A4C'; x.font = F(700, 44); x.fillText(CONFIG.SHARE_URL.replace(/^https?:\/\//, ''), W / 2, H - 204);
  return c;
}

/* ---------------- laptops: tonight's crowns beside the app ---------------- */
const side = {el: null, timer: null};
function sideBoard() {
  side.el ||= document.getElementById('side');
  const on = matchMedia('(min-width:1100px)').matches && route === 'app' && !!S.token && !!S.profile && !!S.user;
  side.el.classList.toggle('on', on);
  if (!on) { clearInterval(side.timer); side.timer = null; return; }
  if (!side.timer) { loadSide(); side.timer = setInterval(() => { if (!document.hidden) loadSide(); }, 15000); }
}
async function loadSide() {
  let q, k; try { [q, k] = await Promise.all([api.getLeaderboard('queen', 'tonight'), api.getLeaderboard('king', 'tonight')]); } catch (e) { return; }
  if (!side.el.classList.contains('on')) return;
  const list = r => (r.top || []).slice(0, 5).map((p, i) => `<div class="rk"><span class="n">${i + 1}</span><img src="${esc(p.photo)}" alt=""><span style="min-width:0"><b>${esc(p.name)}</b><small>${esc(shortCollege(p.college))}</small></span>${p.isMe ? '<span class="you">YOU</span>' : ''}</div>`).join('') || '<p class="note" style="text-align:left;margin:6px 0">No crowns yet tonight.</p>';
  side.el.innerHTML = `<h2>Tonight’s crowns</h2><p class="sub"><span class="livedot" aria-hidden="true"></span>Live · ${esc(tonight().colour)} night</p>
    <h3>${IC.crown} ${esc(CONFIG.BOARD_NAME.female)}</h3>${list(q)}<h3>${IC.crown} ${esc(CONFIG.BOARD_NAME.male)}</h3>${list(k)}
    <button class="btn light" id="sideAll">See the full board</button>`;
  $('#sideAll', side.el).onclick = () => { tab = 'board'; go('app'); };
}
let sideRz; addEventListener('resize', () => { clearTimeout(sideRz); sideRz = setTimeout(sideBoard, 200); });

/* ---------------- Picapool sync ----------------
   Someone may leave to create their Picapool account and come back. Whenever the page comes back into view (and once at boot)
   we ask the server, which asks Picapool; Picapool's backend can also push changes (HANDOFF §4b). */
let ppSyncAt = 0;
async function syncPicapool(force) {
  if (!CONFIG.PICAPOOL_LOOKUP || isDemo() || !S.token || (!force && Date.now() - ppSyncAt < (S.user?.hasPicapool ? 5 * 60e3 : 20e3))) return;
  ppSyncAt = Date.now();
  let r; try { r = await api.lookupPicapool(); } catch (e) { return; }
  if (!r.user || (r.status !== 'found' && !S.user?.hasPicapool)) return;
  const before = S.user || {};
  S.user = {...before, ...r.user, adult: !!(before.adult || r.user.adult)};
  if (r.status === 'found') S.picapool = 'found';
  save(); track('picapool_synced', {status: r.status, nameChanged: !!r.synced?.nameChanged, conflict: r.synced?.conflict || null});
  if (['birthday', 'gender', 'name'].includes(route) && !$('.sheet-bg', app)) go(route);
  else if (route === 'app' && tab === 'me' && !$('.sheet-bg', app)) renderMe();
  if (r.synced?.nameChanged && S.profile) toast(`Your name now matches your Picapool account: ${esc(S.user.firstName)}`);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncPicapool(); });

/* ---------------- boot ---------------- */
document.addEventListener('keydown', e => {
  if (!['ArrowLeft', 'ArrowRight'].includes(e.key) || e.altKey || e.metaKey || e.ctrlKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '') || $('.sheet-bg, .paired', app)) return;
  if (route === 'peek' || (route === 'app' && tab === 'feed')) { e.preventDefault(); flyTop(e.key === 'ArrowRight' ? 'right' : 'left'); }
});
(function boot() {
  if (isDemo()) app.classList.add('is-demo');
  if (S.ageBlocked) return go('blocked');
  if (!upcomingNights().length) return go('ended');
  if (S.token) setTimeout(() => syncPicapool(true), 1500);
  if (S.token && S.user && S.profile) return go('app');
  if (S.token) return go(nextStepAfterLogin());
  go('landing');
})();
</script>
