/* Dandiya Nights · build 2026-10-15-v2
   Two surfaces: a wine "night" for the welcome and sign-up, calm cream inside the app.
   Colour roles: wine = actions inside the app · Picapool orange = the one big action on night screens · marigold = highlights on night ·
   Navratri night colours = small dots that carry meaning (which nights). */
:root{
  --night:#1E0A16; --night-2:#38121F; --on-night:#FFF4E8; --on-night-soft:#D9C4C4;
  --cream:#FAF5EE; --paper:#FFFDF9; --line:#EADDD1; --line-2:#DCCABC;
  --ink:#2E1A22; --ink-2:#5A4048; --muted:#75625A;
  --wine:#5A1E33; --wine-press:#4A1729;
  --accent:#B24F1A; --orange:#FF6B22; --orange-press:#F25F17; --marigold:#F2B25C; --gold:#C9962F;
  --ok:#2F9E62; --err:#B3261E;
  --serif:"DM Serif Display", Georgia, "Times New Roman", serif;
  --sans:Figtree, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease:cubic-bezier(.2,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--night)}
body{color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
input,textarea,select{font:inherit;color:inherit}
img{display:block}
:focus-visible{outline:2px solid var(--marigold);outline-offset:2px}
.app :focus-visible,.card :focus-visible,.sheet :focus-visible{outline-color:var(--wine)}
#app{position:relative;width:100%;max-width:480px;height:100dvh;margin:0 auto;overflow:hidden;background:var(--cream)}
@media (min-width:520px){ body{background:radial-gradient(80% 60% at 50% 0%,#3A1424,var(--night))} #app{box-shadow:0 0 80px rgba(0,0,0,.45)} }
.screen{position:absolute;inset:0;display:flex;flex-direction:column;animation:fadein .3s ease both}
@keyframes fadein{from{opacity:0}}
.scroll{flex:1;overflow-y:auto;scrollbar-width:none;min-height:0;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.is-demo::before{content:"DEMO · sample people · nothing is saved";position:absolute;top:0;left:0;right:0;z-index:90;height:20px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;letter-spacing:.06em;background:#F2B25C;color:#2A1300;pointer-events:none}
.is-demo .screen,.is-demo .paired,.is-demo .sheet-bg{top:20px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* buttons */
.btn{width:100%;min-height:54px;border-radius:14px;background:var(--wine);color:#FFF4E8;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;transition:background .2s,transform .12s,opacity .2s}
.btn:hover{background:var(--wine-press)}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.light{background:var(--paper);color:var(--ink);border:1px solid var(--line-2)}
.btn.light:hover{background:#F6EEE6}
.btn.glow{background:var(--orange);color:#1F0B02}
.btn.glow:hover{background:var(--orange-press)}
.btn.gold{background:linear-gradient(135deg,#E9B65A,#C9962F);color:#2A1A00}
.btn.wa{background:#187A42;color:#fff}
.btn.danger{background:var(--err);color:#fff}
.btn svg{flex-shrink:0}
.text-btn{min-height:44px;color:var(--muted);font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.text-btn b{color:var(--ink)}
.text-btn.full{width:100%}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--wine);animation:spin .8s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* ================= NIGHT: welcome ================= */
.splash{background:radial-gradient(120% 70% at 50% 0%,#5B1C36 0%,var(--night) 58%);color:var(--on-night);align-items:center;text-align:center;padding:calc(18px + env(safe-area-inset-top)) 24px calc(16px + env(safe-area-inset-bottom))}
.splash::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-conic-gradient(from 0deg at 50% 26%,rgba(242,178,92,.06) 0 2deg,transparent 2deg 14deg);-webkit-mask:radial-gradient(circle at 50% 26%,#000 0,transparent 55%);mask:radial-gradient(circle at 50% 26%,#000 0,transparent 55%)}
.splash>*{position:relative}
.brand{height:24px;width:auto;margin-top:4px}
.arch{width:200px;height:222px;margin:14px auto 0;flex-shrink:0}
.chip-night{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 13px;border-radius:99px;border:1px solid rgba(242,178,92,.35);background:rgba(255,244,232,.06);font-size:12.5px;font-weight:600;color:var(--on-night-soft);margin-top:18px}
.chip-night i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.splash h1,.night-title{font-family:var(--serif);font-weight:400;font-size:clamp(32px,9.4vw,38px);line-height:1.08;margin-top:12px}
.splash h1 em,.night-title em{display:block;color:var(--marigold)}
.splash .sub,.night-sub{color:var(--on-night-soft);font-size:15px;line-height:1.5;margin-top:10px;max-width:310px}
.assure{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin-top:auto;padding-top:16px;list-style:none}
.assure li{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;line-height:1.35;color:var(--on-night-soft)}
.assure span{width:32px;height:32px;border-radius:50%;border:1px solid rgba(242,178,92,.4);display:grid;place-items:center;color:var(--marigold)}
.splash .btn{margin-top:16px}
.splash .text-btn{color:var(--on-night-soft)}
.splash .text-btn b{color:var(--on-night)}
@media (max-height:700px){ .arch{width:150px;height:166px;margin-top:8px} .chip-night{margin-top:12px} .assure{padding-top:10px} }
@media (max-height:620px){ .arch{display:none} }
.night-page{background:radial-gradient(110% 70% at 50% 30%,#5B1C36 0%,var(--night) 66%);color:var(--on-night);align-items:center;justify-content:center;text-align:center;padding:24px}
.night-page .btn{margin-top:26px}
.night-page .text-btn{color:var(--on-night-soft)}

/* ================= NIGHT + CARD: sign-up ================= */
.ob{background:radial-gradient(110% 60% at 50% 0%,#5B1C36 0%,var(--night) 62%)}
.crowd{flex:1;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:calc(16px + env(safe-area-inset-top)) 0 16px}
.faces{position:relative;width:260px;height:118px}
.face{position:absolute;left:50%;top:6px;width:76px;height:100px;margin-left:-38px;border-radius:14px;background:linear-gradient(160deg,#7A2B45,#3A1424) center/cover;filter:blur(4px) saturate(1.2);opacity:.9;border:1px solid rgba(255,244,232,.18);
  transform:translateX(calc((var(--i) - 2) * 54px)) rotate(calc((var(--i) - 2) * 8deg)) scale(calc(1 - (var(--i) - 2) * (var(--i) - 2) * .07));
  z-index:calc(5 - (var(--i) - 2) * (var(--i) - 2));animation:float 4.6s ease-in-out infinite;animation-delay:calc(var(--i) * -.9s)}
@keyframes float{50%{translate:0 -6px}}
.live{margin-top:14px;display:inline-flex;align-items:center;gap:8px;padding:8px 15px;border-radius:99px;background:rgba(255,244,232,.08);border:1px solid rgba(242,178,92,.35);color:var(--on-night);font-size:13px;min-height:36px}
.live b{font-family:var(--serif);font-weight:400;font-size:18px;color:var(--marigold);font-variant-numeric:tabular-nums}
.live i{width:8px;height:8px;border-radius:50%;background:#4ADE80}
@media (max-height:640px){ .faces{display:none} .crowd{min-height:60px} }
.card{background:var(--paper);border-radius:28px 28px 0 0;padding:14px 22px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(0,0,0,.35);max-height:78%;overflow-y:auto;scrollbar-width:none;flex-shrink:0;animation:rise .5s var(--ease) both}
.card::-webkit-scrollbar{display:none}
@keyframes rise{from{transform:translateY(24px);opacity:.4}}
.card-top{display:flex;align-items:center;justify-content:space-between;min-height:40px;margin-bottom:6px}
.back{width:40px;height:40px;border-radius:50%;background:#F4EAE1;color:var(--wine);display:grid;place-items:center;flex-shrink:0}
.back:hover{background:#EEDFD3}
.quiet{color:var(--muted);font-size:12.5px;font-weight:600;min-height:40px;padding:0 4px;display:inline-flex;align-items:center;gap:6px}
.q{animation:qin .38s var(--ease) both}
@keyframes qin{from{opacity:0;transform:translateY(8px)}}
.title{font-family:var(--serif);font-weight:400;color:var(--wine);font-size:clamp(27px,7.6vw,31px);line-height:1.1;margin:4px 0 18px}
.title em{display:block;color:var(--accent)}
.from-pp{margin:-8px 0 14px;font-size:12.5px;color:var(--muted)}
.choices{display:grid;gap:10px}
.choice{width:100%;min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 12px 18px;border-radius:16px;background:#fff;border:1.5px solid var(--line);text-align:left;transition:border-color .2s,background .2s,transform .12s;animation:qin .4s var(--ease) both;animation-delay:calc(var(--i,0) * 40ms + 40ms)}
.choice:hover{border-color:var(--line-2)}
.choice:active{transform:scale(.985)}
.choice strong{display:block;font-size:16.5px;font-weight:600;color:var(--ink)}
.choice small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.tick{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;color:transparent;flex-shrink:0;transition:all .2s}
.choice[aria-checked=true]{border-color:var(--wine);background:linear-gradient(135deg,#FFF8F2,#FBEDEF)}
.choice[aria-checked=true] .tick{background:var(--wine);border-color:var(--wine);color:#fff}
.choices.list{gap:8px}
.choices.list .choice{min-height:52px;padding:10px 14px 10px 16px}
.choices.list .choice strong{font-size:15.5px;font-weight:500}
.note{color:var(--muted);font-size:12px;line-height:1.55;text-align:center;margin-top:14px}
.field{width:100%;height:56px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:0 16px;font-size:17px;outline:none;transition:border-color .2s;color:var(--ink)}
.field:focus{border-color:var(--wine)}
.field::placeholder{color:#958379}
.stack{display:grid;gap:12px}
.phone{display:flex;align-items:center;height:56px;border-radius:14px;border:1.5px solid var(--line);background:#fff;transition:border-color .2s}
.phone:focus-within{border-color:var(--wine)}
.phone span{padding:0 12px 0 16px;font-size:17px;font-weight:600;color:var(--ink-2);border-right:1.5px solid var(--line);height:26px;display:flex;align-items:center}
.phone input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;padding:0 14px;font-size:17px;letter-spacing:.03em}
.phone input::placeholder{color:#958379}
.otp{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:10px}
.otp input{height:64px;width:100%;border-radius:14px;border:1.5px solid var(--line);background:#fff;text-align:center;font-family:var(--serif);font-size:28px;color:var(--wine);outline:none;transition:all .2s}
.otp input:focus{border-color:var(--wine)}
.otp.ok input{border-color:var(--ok);background:#F1FAF4}
.dob{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:10px}
.dob .field{text-align:center;padding:0 8px}
.age{min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:6px 0}
.age b{font-family:var(--serif);font-weight:400;font-size:52px;line-height:1;color:var(--wine);animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.age small{color:var(--muted);font-size:12px;margin-top:6px}
.err{color:var(--err);font-size:13px;font-weight:600;text-align:center;min-height:18px;line-height:1.4}
.search{position:relative;margin-bottom:10px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#958379}
.search .field{padding-left:42px;height:48px;font-size:15.5px}
.nights{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nt{position:relative;padding:12px 10px 10px;border-radius:14px;border:1.5px solid var(--line);background:#fff;text-align:left;transition:all .2s}
.nt b{display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:600}
.nt b i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px rgba(46,26,34,.15)}
.nt small{display:block;color:var(--muted);font-size:12px;margin-top:3px;padding-left:16px}
.nt[aria-pressed=true]{border-color:var(--wine);background:linear-gradient(135deg,#FFF8F2,#FBEDEF)}
.every{margin-top:8px;width:100%;min-height:44px;border-radius:12px;border:1.5px dashed var(--line-2);color:var(--ink-2);font-size:14px;font-weight:600}
.every[aria-pressed=true]{border-style:solid;border-color:var(--wine);color:var(--wine)}
.label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:18px 0 8px}
.label em{font-style:normal;font-weight:500;color:var(--muted);margin-left:4px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:40px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-size:13.5px;font-weight:600;color:var(--ink-2);transition:all .2s}
.pill[aria-pressed=true]{border-color:var(--wine);color:var(--wine);background:#FBEDEF}
.terms{color:var(--muted);font-size:11.5px;text-align:center;margin-top:10px;line-height:1.5}
.terms a{text-underline-offset:2px}
.lookup{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 0 6px}
.lookup .spinner{margin:6px auto 16px}

/* reveal */
.reveal .faces{width:300px;height:150px}
.reveal .face{width:92px;height:122px;margin-left:-46px;filter:none;opacity:1;border:2px solid var(--paper);transform:translateX(calc((var(--i) - 2) * 62px)) rotate(calc((var(--i) - 2) * 8deg)) scale(calc(1 - (var(--i) - 2) * (var(--i) - 2) * .07));animation:deal .7s var(--ease) both;animation-delay:calc(var(--i) * 70ms)}
@keyframes deal{from{translate:0 40px;opacity:0}}
.reveal .night-title{margin-top:26px}
.reveal .night-title b{font-weight:400;color:var(--marigold)}

/* ================= DAY: the app ================= */
.app{background:var(--cream)}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 18px 10px;min-height:62px;flex-shrink:0}
.head .mark{width:30px;height:30px}
.head h1{font-family:var(--serif);font-weight:400;font-size:28px;color:var(--wine);line-height:1}
.tonight{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:99px;background:var(--paper);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.tonight i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2);flex-shrink:0}
.seg{display:flex;padding:3px;border-radius:12px;background:#F1E7DD;margin:0 18px 10px;flex-shrink:0}
.seg button{flex:1;min-height:36px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);transition:all .2s;white-space:nowrap;padding:0 6px}
.seg button[aria-pressed=true],.seg button[aria-selected=true]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(90,30,51,.12)}
.nudge{margin:0 18px 10px;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:#FFF6E8;border:1px solid #EBD3A6;flex-shrink:0}
.nudge p{flex:1;font-size:13px;line-height:1.4;color:var(--ink-2)}
.nudge p b{color:var(--ink)}
.nudge .sb{flex-shrink:0}
.crownbar{margin:0 18px 10px;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:14px;background:linear-gradient(135deg,#FFF3D6,#F8E2B5);border:1px solid #E8C47A;flex-shrink:0}
.crownbar span{flex:1;font-size:13.5px;font-weight:600;color:#5A3D00;display:flex;align-items:center;gap:7px}
.crownbar .x{width:32px;height:32px;border-radius:50%;color:#8A6A20;display:grid;place-items:center}
.deck{flex:1;position:relative;margin:0 18px;min-height:0}
.pc{position:absolute;inset:0;border-radius:20px;overflow:hidden;background:var(--paper);border:1px solid var(--line);box-shadow:0 10px 30px rgba(90,50,40,.10);touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .32s var(--ease),opacity .32s}
.pc.front{cursor:grab}
.pc.behind{transform:scale(.95) translateY(10px);opacity:.6;pointer-events:none}
.pc .photo{position:absolute;inset:0;background:linear-gradient(160deg,#7A2B45,#3A1424) center 25%/cover}
.pc .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,10,22,.25) 0,transparent 18%,transparent 46%,rgba(30,10,22,.55) 68%,rgba(30,10,22,.92))}
.pc .bars{position:absolute;top:10px;left:14px;right:56px;display:flex;gap:4px;z-index:2}
.pc .bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.4)}
.pc .bars i.on{background:#fff}
.pc .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 18px 20px;color:#fff}
.pc h2{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1}
.pc .col{display:flex;align-items:center;gap:6px;font-size:14px;color:rgba(255,255,255,.88);margin-top:6px}
.pc .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:12.5px;font-weight:600}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tag.same{background:var(--paper);color:var(--wine)}
.pc .line{margin-top:12px}
.pc .line small{display:block;font-size:11.5px;font-weight:600;letter-spacing:.02em;color:rgba(255,255,255,.7)}
.pc .line p{font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.35;color:#FFF4E8;margin-top:2px}
.pc .sample{position:absolute;top:14px;left:14px;font-size:10.5px;font-weight:700;letter-spacing:.08em;padding:4px 8px;border-radius:6px;background:rgba(30,10,22,.55);color:rgba(255,255,255,.88);z-index:2}
.pc .more{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:50%;background:rgba(30,10,22,.35);color:#fff;display:grid;place-items:center;z-index:3;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.stamp{position:absolute;top:30px;padding:4px 12px;border-radius:8px;border:2.5px solid;font-family:var(--serif);font-size:22px;opacity:0;background:rgba(30,10,22,.25);z-index:2}
.stamp.yes{left:16px;color:var(--marigold);border-color:var(--marigold);transform:rotate(-8deg)}
.stamp.no{right:16px;color:#fff;border-color:#fff;transform:rotate(8deg)}
.actions{display:flex;align-items:center;justify-content:center;gap:18px;margin:12px auto 12px;padding:7px 10px;border-radius:40px;background:var(--paper);border:1px solid var(--line);box-shadow:0 6px 22px rgba(90,48,35,.10);flex-shrink:0}
.actions span{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--muted);min-width:96px;text-align:center}
.round{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;transition:transform .12s,opacity .2s}
.round:active{transform:scale(.92)}
.round.skip{background:#F4EAE1;color:var(--ink-2)}
.round.pair{background:var(--wine);color:var(--marigold)}
.round:disabled{opacity:.35;cursor:default}
.empty{position:absolute;inset:0;border-radius:20px;border:1.5px dashed var(--line-2);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px;overflow-y:auto}
.empty h2{font-family:var(--serif);font-weight:400;font-size:25px;color:var(--wine);line-height:1.15}
.empty h2 em{display:block;color:var(--accent)}
.empty p{color:var(--muted);font-size:14px;line-height:1.5}
.empty .btn{max-width:260px;margin-top:6px}
.bottom-cta{padding:0 18px calc(14px + env(safe-area-inset-bottom));flex-shrink:0}
.tabs{display:flex;justify-content:space-around;align-items:center;border-top:1px solid var(--line);background:rgba(255,252,248,.97);padding:4px 10px calc(4px + env(safe-area-inset-bottom));flex-shrink:0}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:64px;min-height:56px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
.tabs button[aria-current]{color:var(--wine)}
.badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center}
.cdot{position:absolute;top:8px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--gold);border:2px solid var(--paper)}

/* lists */
.pad{padding:2px 18px 18px}
.hint{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12.5px;line-height:1.45;margin:2px 0 12px}
.row{display:flex;gap:13px;padding:14px;border-radius:16px;background:var(--paper);border:1px solid var(--line);margin-bottom:10px;position:relative}
.row>img,.row>.ph0{width:56px;height:56px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#EADDD1}
.row .m{flex:1;min-width:0}
.row b{font-size:16px;font-weight:600;color:var(--ink)}
.row small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.row .both{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-top:6px}
.row .both i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.row .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.row .rmore{position:absolute;top:8px;right:6px;width:36px;height:36px;border-radius:50%;color:var(--muted);display:grid;place-items:center}
.sb{min-height:40px;padding:0 14px;border-radius:10px;font-size:13.5px;font-weight:600;background:#F4EAE1;color:var(--ink);display:inline-flex;align-items:center;text-decoration:none}
.sb.pri{background:var(--wine);color:#FFF4E8}
.sb:disabled{opacity:.5}
.status{font-size:12.5px;font-weight:600;color:var(--accent);margin-top:6px}
.status.mute{color:var(--muted)}
.nothing{text-align:center;color:var(--muted);font-size:14px;line-height:1.5;padding:36px 16px}
.nothing .btn{margin-top:16px}

/* board */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;margin:18px 0 6px}
.pod{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.pod .cr{height:20px;color:var(--gold)}
.pod .av{width:66px;height:66px;border-radius:50%;padding:3px;background:var(--line)}
.pod.p1 .av{width:86px;height:86px;background:linear-gradient(135deg,#E9B65A,#C9962F)}
.pod .av img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--paper)}
.pod b{font-size:14.5px;font-weight:600;margin-top:8px}
.pod small{font-size:11.5px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .base{width:100%;margin-top:10px;border-radius:12px 12px 0 0;background:#F1E7DD;display:grid;place-items:center;font-family:var(--serif);font-size:22px;color:var(--muted)}
.pod.p1 .base{height:78px;background:linear-gradient(180deg,#F6E3C4,#F1E7DD);color:#A87A20;font-size:28px}
.pod.p2 .base{height:58px}.pod.p3 .base{height:44px}
.rk{display:flex;align-items:center;gap:14px;padding:11px 4px;border-bottom:1px solid var(--line)}
.rk .n{width:20px;text-align:center;color:var(--muted);font-weight:600}
.rk img{width:42px;height:42px;border-radius:50%;object-fit:cover}
.rk b{display:block;font-size:15px;font-weight:600}
.rk small{color:var(--muted);font-size:12.5px}
.rk .you{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--wine);background:#FBEDEF;border-radius:6px;padding:3px 7px}

<script>
/* =====================================================================
   DANDIYA NIGHTS · Picapool · build 2026-10-15-v2

   Everything tech needs to edit is in CONFIG.
   ===================================================================== */
const CONFIG = {

  APP_STORE: 'https://apps.apple.com/app/REPLACE_ME',                          // TODO tech
  // Navratri 2026 (Delhi calendar). Past nights hide automatically. Keep in step with NIGHT_DATES in server.js.
  NIGHTS: [
    {id:'d1', date:'2026-10-11', day:'Sun', colour:'Orange',        hex:'#F7821B'},
    {id:'d2', date:'2026-10-12', day:'Mon', colour:'White',         hex:'#F4EFE6'},
    {id:'d3', date:'2026-10-13', day:'Tue', colour:'Red',           hex:'#E0343F'},
    {id:'d4', date:'2026-10-14', day:'Wed', colour:'Royal blue',    hex:'#2F55E0'},
    {id:'d5', date:'2026-10-15', day:'Thu', colour:'Yellow',        hex:'#F5C518'},
    {id:'d6', date:'2026-10-16', day:'Fri', colour:'Green',         hex:'#1FA34A'},
    {id:'d7', date:'2026-10-17', day:'Sat', colour:'Grey',          hex:'#9AA0A6'},
    {id:'d8', date:'2026-10-18', day:'Sun', colour:'Purple',        hex:'#8A4BE0'},
    {id:'d9', date:'2026-10-19', day:'Mon', colour:'Peacock green', hex:'#0E9A8C'},
  ],
  // TODO Purav: the real events North Campus goes to (optional "Where, mostly?" on the nights screen, and the plan in "Say hi")
  VENUES: ['Main North Campus event', 'College garba', 'Society / PG garba', 'Not sure yet'],
  PLAN_TIMES: ['7:30 pm', '8:00 pm', '8:30 pm', '9:00 pm'],
  MAX_PHOTOS: 5,                 // must match server MAX_PHOTOS
  GUEST_PEEK_LIMIT: 5,           // guests see at most this many people before making a pass
  BOARD_SIZE: 20,                // top N per board get crowned; must match server BOARD_SIZE
  // North Campus colleges. Guys only see COLLEGES_COED; girls see both lists. Anything else: "Other college" + type it.
  COLLEGES_COED: ['Hansraj College','Hindu College','Kirori Mal College','Ramjas College','SGTB Khalsa College',
                  'Shri Ram College of Commerce',"St. Stephen's College",'Faculty of Law','DU department / DSE'],
  COLLEGES_WOMEN: ['Daulat Ram College','Indraprastha College for Women','Miranda House'],
};
const OTHER_COLLEGE = '__other';
const collegesFor = gender => [...CONFIG.COLLEGES_COED, ...(gender === 'female' ? CONFIG.COLLEGES_WOMEN : [])].sort((a, b) => a.localeCompare(b));
const PROMPTS = [['anthem', 'My garba anthem is'], ['teach', "I'll teach you"], ['find', 'Find me near the'], ['flag', 'Dandiya green flag']];
const promptLabel = id => (PROMPTS.find(p => p[0] === id) || [, ''])[1];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAY = {Sun:'Sunday',Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday',Fri:'Friday',Sat:'Saturday'};

/* ---------------- helpers ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const todayISO = () => { try { return new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Kolkata'}).format(new Date()); } catch (e) { return new Date().toISOString().slice(0,10); } };
const hash = s => { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const rng = seed => { let a = hash(seed); return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
const shuffle = (arr, seed) => { const r = rng(seed), a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const nightById = id => CONFIG.NIGHTS.find(n => n.id === id);
const upcomingNights = () => CONFIG.NIGHTS.filter(n => n.date >= todayISO());
const tonight = () => upcomingNights()[0] || CONFIG.NIGHTS[CONFIG.NIGHTS.length - 1];
const nightNo = () => CONFIG.NIGHTS.indexOf(tonight()) + 1;
const fmtDate = n => `${n.day} ${+n.date.slice(8)}`;
const nightName = n => n.id === tonight().id ? 'Tonight' : fmtDate(n);
const rgb = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
const hexA = (hex, a) => `rgba(${rgb(hex).join(',')},${a})`;
const boardFor = g => CONFIG.BOARD_NAME[g === 'female' ? 'female' : 'male'];
const other = g => g === 'female' ? 'male' : 'female';
const who = (g, n = 2) => g === 'male' ? (n === 1 ? 'guy' : 'guys') : g === 'female' ? (n === 1 ? 'girl' : 'girls') : (n === 1 ? 'person' : 'people');
const andList = xs => xs.length < 2 ? (xs[0] || '') : xs.slice(0, -1).join(', ') + ' and ' + xs[xs.length - 1];
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const fmtPhone = d => d && d.length > 5 ? d.slice(0, 5) + ' ' + d.slice(5) : (d || '');
const shortCollege = c => String(c || '').replace(' College for Women', '').replace('Shri Ram College of Commerce', 'SRCC').replace(' College', '');
const isDemo = () => CONFIG.MODE !== 'live';
const TOP = (() => { try { return window.self === window.top; } catch (e) { return false; } })();
const buzz = ms => { if (!TOP) return; try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
const canClipboard = () => { try { if (!navigator.clipboard || !window.isSecureContext) return false; const fp = document.permissionsPolicy || document.featurePolicy; return !fp || fp.allowsFeature('clipboard-write'); } catch (e) { return false; } };

let toastT;
function toast(msg) {
  let t = $('#toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); t.setAttribute('aria-live', 'polite'); $('#app').appendChild(t); }
  app.appendChild(t); t.classList.toggle('up', !!$('.sheet-bg', app));
  t.innerHTML = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800);
}

/* ---------------- state ---------------- */
const KEY = 'dn_v1';
const freshState = () => ({
  sessionId: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
  token: null, phone: '', user: null, profile: null, ref: null, entry: null,
  guest: null,        // before signing up: {firstName, gender, likes, seenIds, done, pool, gated}
  swipes: {}, rightsByDay: {}, matches: [], blocked: [], seenMatchIds: [], ageBlocked: false, crown: null, crownHidden: null, loginOnly: false,
  picapool: null,     // result of the Picapool account lookup after OTP: 'found' | 'not_found' | 'unavailable'
  feedSwipes: 0, lineAsked: false, photoAsked: false,
});
let S = Object.assign(freshState(), store.get(KEY, {}));
const save = () => store.set(KEY, S);
(function captureRef() {
  let u; try { u = new URL(location.href); } catch (e) { return; }
  if (u.searchParams.has('new')) {
    store.del(KEY); store.del('dn_mock'); S = freshState();
    u.searchParams.delete('new');
    try { history.replaceState(null, '', u.pathname + (u.search || '') + u.hash); } catch (e) {}
  }
  const seg = (u.pathname.split('/').filter(Boolean)[0] || '');
  const ref = u.searchParams.get('ref') || u.searchParams.get('r') || (seg && !seg.includes('.') ? seg : null);
  if (ref && !S.ref) { S.ref = ref.slice(0, 40); S.entry = location.href.slice(0, 200); save(); }
})();
const myRefSlug = () => 'st-' + String(S.user?.id || S.sessionId).slice(-8);
const shareLink = () => `${CONFIG.SHARE_URL}?ref=${myRefSlug()}`;
/* who I am: once linked to Picapool, its first name and gender win over what was typed here (HANDOFF §4b) */
const myName = () => (S.user?.firstName) || S.guest?.firstName || '';
const myGender = () => S.user?.gender || S.guest?.gender || null;
const myPhoto = () => S.profile?.photos?.[0] || null;
let dobOk = false; // set on the birthday screen; the date itself is never saved or sent

/* ---------------- tracking (live only, never logs to console) ---------------- */
function track(event, data = {}) {
  if (isDemo()) return;
  const payload = JSON.stringify({event, data, sessionId: S.sessionId, ref: S.ref, build: CONFIG.BUILD, ts: new Date().toISOString()});
  try {
    if (navigator.sendBeacon && navigator.sendBeacon(CONFIG.API_BASE + '/events', new Blob([payload], {type: 'text/plain'}))) return;
    fetch(CONFIG.API_BASE + '/events', {method: 'POST', body: payload, headers: {'Content-Type': 'text/plain'}, keepalive: true}).catch(() => {});
  } catch (e) {}
}

/* =====================================================================
   API LAYER. The UI only calls `api`. Contract: HANDOFF.md §7.
   ===================================================================== */
class LiveApi {
  async req(method, path, body) {
    let res;
    try {
      res = await fetch(CONFIG.API_BASE + path, {
        method, headers: {'Content-Type': 'application/json', ...(S.token ? {Authorization: 'Bearer ' + S.token} : {})},
        body: body ? JSON.stringify(body) : undefined,
      });
    } catch (e) { throw new Error('No internet. Check your connection and try again.'); }
    const json = await res.json().catch(() => ({}));
    if (res.status === 401 && S.token) { S = Object.assign(freshState(), {ref: S.ref, entry: S.entry}); save(); setTimeout(() => go('landing'), 0); throw new Error('Please log in again.'); }
    if (!res.ok) { const err = new Error(json.message || 'Something went wrong. Try again.'); err.code = json.code; throw err; }
    return json;
  }
  getPreview(gender, nights)     { return this.req('GET', `/preview?gender=${gender}&nights=${encodeURIComponent((nights || []).join(','))}`); }
  sendOtp(phone)                 { return this.req('POST', '/auth/otp', {phone}); }
  verifyOtp(phone, code)         { return this.req('POST', '/auth/verify', {phone, code, ref: S.ref, entry: S.entry, sessionId: S.sessionId}); }
  lookupPicapool()               { return this.req('POST', '/picapool/lookup', {}); }
  saveAccount(acc)               { return this.req('POST', '/account', acc); }
  recordAgeBlock()               { return this.req('POST', '/age-block', {}); }
  saveProfile(p)                 { return this.req('PUT', '/profile', p); }
  setPaused(paused)              { return this.req('POST', '/profile/pause', {paused}); }
  getFeed(opts)                  { return this.req('GET', '/feed?all=' + (opts.allNights ? 1 : 0) + (opts.passed ? '&passed=1' : '')); }
  swipe(targetId, dir)           { return this.req('POST', '/swipe', {targetId, dir}); }
  getMatches()                   { return this.req('GET', '/matches'); }
  getSentLikes()                 { return this.req('GET', '/likes/sent'); }
  getReceivedLikes()             { return this.req('GET', '/likes/received'); }
  dismissLike(targetId)          { return this.req('POST', '/likes/dismiss', {targetId}); }
  openChat(matchId, opener)      { return this.req('POST', `/matches/${encodeURIComponent(matchId)}/chat`, {opener}); }

/* welcome illustration: an arched window on a Navratri night, lights in the nine colours, a pair of dandiya sticks */
function archArt() {
  const bulbs = Array.from({length: 13}, (_, i) => { const t = i / 12, x = 30 + t * 152, y = 102 + Math.sin(Math.PI * t) * 20, c = CONFIG.NIGHTS[i % 9].hex;
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" fill="${c}" opacity=".18"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2" fill="${c}"/>`; }).join('');
  const stick = (x1, y1, x2, y2, bands) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#E9B04A" stroke-width="7" stroke-linecap="round"/>${bands.map(([t, c]) => `<circle cx="${x1 + (x2 - x1) * t}" cy="${y1 + (y2 - y1) * t}" r="3.6" fill="${c}"/>`).join('')}`;
  return `<svg class="arch" viewBox="0 0 212 236" aria-hidden="true" focusable="false">
    <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A0C1E"/><stop offset="1" stop-color="#4E1A30"/></linearGradient>
      <clipPath id="win"><path d="M14 236V104C14 52 56 16 106 8c50 8 92 44 92 96v132z"/></clipPath></defs>
    <path d="M14 236V104C14 52 56 16 106 8c50 8 92 44 92 96v132z" fill="url(#sky)"/>
    <g clip-path="url(#win)">
      <circle cx="106" cy="58" r="30" fill="#FFF1DC" opacity=".08"/><circle cx="106" cy="58" r="15" fill="#FFF1DC"/>
      <g fill="#FFF4E8">${[[44,46,1.2],[160,40,1.4],[70,80,1],[150,78,1],[124,30,.9],[88,34,1]].map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" opacity=".7"/>`).join('')}</g>
      <path d="M30 102 Q106 142 182 102" stroke="#F2B25C" stroke-opacity=".5" fill="none"/>${bulbs}
      <ellipse cx="106" cy="226" rx="70" ry="9" fill="#000" opacity=".28"/>
      ${stick(70, 220, 126, 140, [[.12, '#E0343F'], [.2, '#1FA34A'], [.86, '#2F55E0']])}${stick(142, 220, 86, 140, [[.12, '#0E9A8C'], [.2, '#FF6B22'], [.86, '#8A4BE0']])}
    </g>
    <path d="M14 236V104C14 52 56 16 106 8c50 8 92 44 92 96v132" fill="none" stroke="#F2B25C" stroke-width="1.4"/>
    <path d="M4 236V100C4 44 50 6 106 -2c56 8 102 46 102 102v136" fill="none" stroke="#F2B25C" stroke-opacity=".35"/>
  </svg>`;
}
/* a photo, or a soft placeholder when someone has no photo yet */
const photoOr = (src, cls = '') => src ? `<img src="${esc(src)}" alt="" class="${cls}">` : `<span class="ph0 ${cls}" aria-hidden="true"></span>`;

/* =====================================================================
   ROUTING
   ===================================================================== */
const app = $('#app');
const ONBOARD = ['name', 'gender', 'phone', 'code', 'lookup', 'birthday', 'college', 'nights'];
let route = null, tab = 'feed', editing = null; // editing: 'nights' | 'college' when changed from the profile
const demoFlag = () => ''; // demo mode shows its label with CSS (.is-demo), so re-rendering a screen can't remove it
function go(name, opts = {}) {
  route = name;
  closeSheet(true); $('.paired', app)?.remove();
  (SCREENS[name] || SCREENS.landing)(opts);
  const b = app.querySelector('[data-back]');
  if (b) b.onclick = () => back(name);
  $$('[data-tab]', app).forEach(t => t.onclick = () => { tab = t.dataset.tab; go('app'); });
  const af = $('[data-autofocus]', app);
  if (af && matchMedia('(hover:hover)').matches) setTimeout(() => af.isConnected && af.focus({preventScroll: true}), 140);
}
function back(name) {
  if (editing) { editing = null; tab = 'me'; return go('app'); }
  if (S.token) { // signed in: there's no going back to before the code
    if (name === 'birthday' || name === 'lookup') return go('landing');
    if (name === 'college') return go('birthday');
    if (name === 'nights') return go('college');
    if (name === 'gender') return go('name');
    return go('landing');
  }
  const prev = {name: 'landing', gender: 'name', peek: 'gender', phone: S.loginOnly ? 'landing' : (S.guest?.gender ? 'peek' : 'landing'), code: 'phone'}[name];
  go(prev || 'landing');
}
/* the one place that decides where someone signed in goes next */
function nextStepAfterLogin() {
  if (!S.token) return 'phone';
  if (S.profile) return 'app';
  if (!S.picapool) return 'lookup';
  if (!myName()) return 'name';
  if (!myGender()) return 'gender';
  if (!S.user?.adult && !dobOk) return 'birthday';
  if (!S.user?.adult || !S.user?.college) return 'college';
  return 'nights';
}

/* sign-up frame: live crowd on top, one question on a cream card */
let crowdCache = {}; // gender → {faces, count}
async function loadCrowd(g) {
  if (crowdCache[g]) return crowdCache[g];
  try { const r = await api.getPreview(g, []); crowdCache[g] = {faces: (r.profiles || []).map(p => p.photo).filter(Boolean), count: typeof r.count === 'number' ? r.count : null}; }
  catch (e) { crowdCache[g] = {faces: [], count: null}; }
  return crowdCache[g];
}
function crowdLine(g, c) {
  if (c && c.count) return `<i aria-hidden="true"></i><b>${c.count}</b> ${who(g, c.count)} from North Campus are going`;
  return `<i aria-hidden="true"></i>North Campus is going to garba`;
}
function crowdHtml() {
  const g = myGender() ? other(myGender()) : null;
  return `<div class="crowd"><div class="faces" aria-hidden="true">${[0, 1, 2, 3, 4].map(i => `<span class="face" style="--i:${i}"></span>`).join('')}</div>
    <p class="live" role="status" id="crowdLine">${crowdLine(g, g && crowdCache[g])}</p></div>`;
}
async function fillCrowd() {
  const g = myGender() ? other(myGender()) : null, here = route;
  const parts = g ? [await loadCrowd(g)] : await Promise.all([loadCrowd('female'), loadCrowd('male')]);
  if (route !== here) return;
  const faces = g ? parts[0].faces : [0, 1, 2, 3, 4].map(i => parts[i % 2].faces[Math.floor(i / 2)]).filter(Boolean);
  $$('.crowd .face', app).forEach((f, i) => { if (faces[i % (faces.length || 1)]) f.style.backgroundImage = `url('${faces[i % faces.length]}')`; });
  const line = $('#crowdLine', app); if (line) line.innerHTML = crowdLine(g, g ? parts[0] : null);
}
function obFrame(body, {noBack = false, right = ''} = {}) {
  app.innerHTML = `<section class="screen ob">${crowdHtml()}
    <div class="card" role="main"><header class="card-top">${noBack ? '<span></span>' : `<button class="back" data-back aria-label="Back">${IC.back}</button>`}${right}</header>
    <div class="q">${body}</div></div></section>`;
  fillCrowd();
}
const tonightChip = () => { const t = tonight(); return `<span class="tonight" style="--c:${t.hex}"><i></i>Night ${nightNo()} · ${esc(t.colour)}</span>`; };
const SCREENS = {};

/* ---------- welcome ---------- */
SCREENS.landing = () => {
  if (S.ageBlocked) return go('blocked');
  if (!upcomingNights().length) return go('ended');
  const t = tonight(), signedIn = S.token && S.profile;
  app.innerHTML = `<section class="screen splash">
    <img class="brand" src="${LOCKUP}" alt="Picapool">
    ${archArt()}
    <p class="chip-night" style="--c:${t.hex}"><i></i>Night ${nightNo()} of 9 · ${esc(t.colour)}</p>
    <h1>Your Dandiya night<em>starts here.</em></h1>
    <p class="sub">See who from North Campus is going on your nights, pair up, and meet at the garba.</p>
    <ul class="assure">
      <li><span>${IC.lock}</span>Your number stays private</li>
      <li><span>${IC.cap}</span>North Campus students, 18+</li>
      <li><span>${IC.shield}</span>Block or report anyone</li>
    </ul>
    <button class="btn glow" id="start">${signedIn ? 'Open Dandiya Nights' : 'See who’s going'} ${IC.arrow}</button>
    ${signedIn ? '' : '<button class="text-btn" id="login">Already have a pass? <b>Log in</b></button>'}</section>`;
  $('#start').onclick = () => { track('cta_start'); S.loginOnly = false; save(); go(S.token ? nextStepAfterLogin() : (S.guest?.gender ? 'peek' : 'name')); };
  $('#login') && ($('#login').onclick = () => { track('cta_login'); S.loginOnly = true; save(); go('phone'); });
  track('landing_view');
};

/* ---------- name ---------- */
const NAME_OK = /^[\p{L}][\p{L} .'-]{1,19}$/u; // same rule as the server
SCREENS.name = () => {
  obFrame(`<h1 class="title">What should we<em>call you?</em></h1>
    <form class="stack" id="f" novalidate><input class="field" id="fn" maxlength="20" autocomplete="given-name" autocapitalize="words" enterkeyhint="next" placeholder="Your first name" value="${esc(myName())}" aria-label="First name" aria-describedby="err" data-autofocus>
    <p class="err" id="err" role="alert"></p>
    <button class="btn" id="nx">Continue ${IC.arrow}</button></form>
    <p class="note">Only your first name is shown.</p>`);
  const fn = $('#fn'), nx = $('#nx'), err = $('#err');
  const ok = () => { nx.disabled = fn.value.replace(/\s+/g, ' ').trim().length < 2; err.textContent = ''; };
  fn.oninput = ok; ok();
  $('#f').onsubmit = e => {
    e.preventDefault(); const v = fn.value.replace(/\s+/g, ' ').trim();
    if (!NAME_OK.test(v)) { err.textContent = 'Use letters only for your first name.'; return fn.focus(); }
    S.guest = {likes: [], seenIds: [], done: [], pool: [], ...(S.guest || {}), firstName: v};
    if (S.user && !S.user.hasPicapool) S.user.firstName = v;
    save(); go('gender');
  };
};

/* ---------- gender ---------- */
SCREENS.gender = () => {
  const g = myGender(), linked = !!S.user?.hasPicapool && !!S.user?.gender;
  obFrame(`<h1 class="title">Hi ${esc(myName() || 'there')}.<em>Who’s dancing?</em></h1>
    <div class="choices" role="radiogroup" aria-label="You are">
      ${[['female', 'Girl'], ['male', 'Guy']].map(([v, l], i) => `<button class="choice" role="radio" style="--i:${i}" data-v="${v}" aria-checked="${g === v}" ${linked && g !== v ? 'disabled' : ''}><span><strong>${l}</strong></span><span class="tick">${IC.check}</span></button>`).join('')}
    </div>
    <p class="note">${linked ? 'From your Picapool account. Change it in the Picapool app.' : 'This only decides whose cards you see.'}</p>`);
  $$('.choice').forEach(b => b.onclick = () => {
    const v = b.dataset.v;
    if (S.guest?.gender && S.guest.gender !== v) { S.guest.likes = []; S.guest.pool = []; S.guest.done = []; } // picks for the other side no longer apply; the 5-person limit still counts
    S.guest = {likes: [], seenIds: [], done: [], pool: [], ...(S.guest || {}), gender: v};
    if (S.user && !S.user.hasPicapool) S.user.gender = v;

const peekLimitReached = () => (S.guest?.seenIds?.length || 0) >= CONFIG.GUEST_PEEK_LIMIT;
function peekGate(reason) {

function flyPeek(el, p, dir) {
  const g = S.guest; flying = true;
  flyOut(el, dir);

  if (dir === 'right' && !g.likes.includes(p.id)) { g.likes.push(p.id); buzz(10); }
  save(); track('peek_swipe', {dir});
  setTimeout(() => { flying = false; drawDeck(); }, 260);
  if (!feed.queue.length && peekLimitReached() && !g.gated) { g.gated = true; save(); setTimeout(() => route === 'peek' && peekGate('limit'), 420); }

/* after the pass is made: send the picks held on the phone (sample people never; they go nowhere) */
async function sendPendingLikes() {
  const pool = S.guest?.pool || [];
  const ids = (S.guest?.likes || []).filter(id => !(pool.find(p => p.id === id)?.sample && !isDemo()) && !String(id).startsWith('sample-')).slice(0, CONFIG.GUEST_PEEK_LIMIT);
  let first = null, sent = 0;
  for (const id of ids) {

}

      ${isDemo() ? `<br>Demo: any ${L} digits work.` : ''}</p>`);
  const ins = $$('#otp input'), err = $('#err');
  let busy = false;
  const verify = async () => {
    const code = ins.map(i => i.value).join('');
    if (busy || code.length < L) return; busy = true;
    $('#otp').classList.add('ok'); ins.forEach(i => i.blur());
    try {
      const r = await api.verifyOtp(S.phone, code);
      S.token = r.token; S.user = r.user || null; S.profile = r.profile || null; S.picapool = null; save();

  };
  ins.forEach((inp, i) => {
    inp.oninput = () => {
      err.textContent = '';
      const d = inp.value.replace(/\D/g, '');
      if (d.length > 1) { d.split('').slice(0, L - i).forEach((c, k) => ins[i + k].value = c); ins[Math.min(L - 1, i + d.length - 1)].focus(); }
      else { inp.value = d; if (d && i < L - 1) ins[i + 1].focus(); }

};

async function checkCrown(force) {
  if (!S.user || !S.profile) return;
  if (!S.profile.inBoard) return setCrown(null);
  if (!force && Date.now() - crownCheckedAt < 60e3) return;
  crownCheckedAt = Date.now();
  try { const r = await api.getLeaderboard(myBoardKey(), 'tonight'); setCrown(r.me && r.me.rank ? {rank: r.me.rank, day: todayISO()} : null); } catch (e) {}
}
function setCrown(c) {
  const before = JSON.stringify(S.crown || null); S.crown = c; save();
  if (before === JSON.stringify(c)) return;
  if (c && (!before || before === 'null')) track('crown_earned', {rank: c.rank});
  refreshNav(); renderCrownBar();
}
function renderCrownBar() {
  const el = $('#crownBar'); if (!el) return;

let pollTimer = null;
function startPolling() {

  pollTimer = setInterval(async () => {
    if (document.hidden || route !== 'app' || !S.token) return;
    try { await syncMatches(); } catch (e) {}
    checkCrown();

}
async function syncMatches() {
  const r = await api.getMatches();
  const before = new Set(S.matches.map(m => m.id));
  S.matches = r.matches || []; save();
  const fresh = S.matches.filter(m => !before.has(m.id));
  if (fresh.length && tab !== 'pairs') { buzz([20, 40, 20]); toast(`New pair: ${esc(fresh[0].person.name)}`); }

}
SCREENS.app = () => {

let feed = {queue: [], allNights: false, peekLoaded: false, mode: 'new'}; // mode: 'new' | 'passed'

    ${tabsHtml()}</section>`;
  bindTabs(); renderCrownBar();

  $('#addPh') && ($('#addPh').onclick = () => photosSheet());
  $('#unpause') && ($('#unpause').onclick = () => setPaused(false));
  $$('[data-f]').forEach(b => b.onclick = () => { const all = b.dataset.f === 'all'; if (all === feed.allNights) return; feed.allNights = all; feed.queue = []; renderFeed(); });
  $('#doneRev') && ($('#doneRev').onclick = endReview);
  $('#nope').onclick = () => flyTop('left'); $('#yep').onclick = () => flyTop('right');
  if (!feed.queue.length) {

    catch (e) { if ($('#deck')) { $('#deck').innerHTML = `<div class="empty"><p>${esc(e.message)}</p><button class="btn light" id="retry">Try again</button></div>`; $('#retry').onclick = renderFeed; } return; }

function startReview() { feed.mode = 'passed'; feed.queue = []; track('review_passed'); renderFeed(); }
function endReview() { feed.mode = 'new'; feed.queue = []; renderFeed(); }
function drawDeck() {
  const d = $('#deck'); if (!d) return;
  const q = feed.queue, peek = route === 'peek';
  const acts = $('#acts');
  if (!q.length) {
    if (acts) acts.style.visibility = 'hidden';
    if (peek) {
      d.innerHTML = peekLimitReached()
        ? `<div class="empty"><h2>That’s tonight’s top five.<em>Everyone else is inside.</em></h2><p>Make your pass to see everyone going this Navratri. It takes about a minute.</p><button class="btn" id="e1">Make my pass</button></div>`
        : `<div class="empty"><h2>That’s everyone<em>for now.</em></h2><p>Make your pass and we’ll show you people as they join.</p><button class="btn" id="e1">Make my pass</button></div>`;
      $('#e1').onclick = () => go('phone'); return;
    }
    if (feed.mode === 'passed') { d.innerHTML = `<div class="empty"><h2>That’s everyone<em>you skipped.</em></h2><button class="btn light" id="e2">Back to new people</button></div>`; $('#e2').onclick = endReview; return; }
    d.innerHTML = `<div class="empty"><h2>You’ve seen everyone<em>${feed.allNights ? 'for now.' : 'on your nights.'}</em></h2><p>More people join every hour. Bring your friends along.</p>
      <button class="btn" id="e3">${IC.share} Invite friends</button>
      ${feed.allNights ? '' : '<button class="btn light" id="e4">Show all nights</button>'}
      <button class="text-btn" id="e5">${IC.undo} Look at people you skipped</button></div>`;
    $('#e3').onclick = () => openInvite();
    $('#e4') && ($('#e4').onclick = () => { feed.allNights = true; feed.queue = []; renderFeed(); });

function bindCard(el, p) {
  let sx = 0, sy = 0, dx = 0, dy = 0, dragging = false, moved = false, downT = null;
  const yes = $('.stamp.yes', el), no = $('.stamp.no', el);
  el.addEventListener('pointerdown', e => { if (e.target.closest('.more')) return; dragging = true; moved = false; downT = e.target; sx = e.clientX; sy = e.clientY; dx = dy = 0;
    try { el.setPointerCapture(e.pointerId); } catch (_) {} el.style.transition = 'none'; });
  el.addEventListener('pointermove', e => { if (!dragging) return; dx = e.clientX - sx; dy = e.clientY - sy; if (Math.abs(dx) > 8 || Math.abs(dy) > 8) moved = true;
    el.style.transform = `translate(${dx}px,${dy * .2}px) rotate(${dx / 22}deg)`; yes.style.opacity = Math.max(0, Math.min(1, dx / 90)); no.style.opacity = Math.max(0, Math.min(1, -dx / 90)); });
  const end = e => { if (!dragging) return; dragging = false; el.style.transition = '';
    if (Math.abs(dx) > Math.min(110, el.offsetWidth * 0.28)) return (route === 'peek' ? flyPeek : fly)(el, p, dx > 0 ? 'right' : 'left');
    el.style.transform = ''; yes.style.opacity = no.style.opacity = 0;
    if (!moved && e.type === 'pointerup') tapCard(el, p, e, downT); };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  const mb = $('.more', el); if (mb) mb.onclick = e => { e.stopPropagation(); openReport(p); };
}
function tapCard(el, p, e) {
  const photos = p.photos || []; if (photos.length < 2) return;
  const r = el.getBoundingClientRect(); let i = +el.dataset.photo;
  i = e.clientX - r.left > r.width / 2 ? Math.min(i + 1, photos.length - 1) : Math.max(i - 1, 0);
  el.dataset.photo = i; $('.photo', el).style.backgroundImage = `url('${photos[i]}')`; $$('.bars i', el).forEach((b, j) => b.classList.toggle('on', j <= i));
}
let flying = false;
function flyTop(dir) { if (flying) return; const el = $('.pc.front', app); if (el && feed.queue[0]) (route === 'peek' ? flyPeek : fly)(el, feed.queue[0], dir); }
function flyOut(el, dir) {
  $(dir === 'right' ? '.stamp.yes' : '.stamp.no', el).style.opacity = 1;
  el.style.transition = 'transform .32s cubic-bezier(.45,0,.85,.4), opacity .32s';
  el.style.transform = `translate(${dir === 'right' ? 130 : -130}%, 20px) rotate(${dir === 'right' ? 18 : -18}deg)`; el.style.opacity = 0;
  const b = $('.pc.behind', app); if (b) { b.style.transform = 'none'; b.style.opacity = 1; }
}
async function fly(el, p, dir) {
  if (dir === 'right' && rightsLeft() <= 0) { el.style.transform = ''; $$('.stamp', el).forEach(s => s.style.opacity = 0); return limitSheet(); }
  flying = true;
  flyOut(el, dir);
  feed.queue.shift();
  const prev = S.swipes[p.id];
  S.swipes[p.id] = {dir, at: Date.now(), retried: !!prev};
  if (dir === 'right') { S.rightsByDay[todayISO()] = (S.rightsByDay[todayISO()] || 0) + 1; if (serverRightsLeft !== null) serverRightsLeft = Math.max(0, serverRightsLeft - 1); buzz(10); }
  S.feedSwipes = (S.feedSwipes || 0) + 1;
  save(); track('swipe', {dir, review: feed.mode === 'passed'});
  setTimeout(() => { flying = false; drawDeck(); const h = $('#actHint'); if (h) h.textContent = rightsLeft() <= 0 ? 'more picks at midnight' : 'skip or pair up'; }, 260);
  let matched = false;
  try {
    const r = await api.swipe(p.id, dir);
    if (typeof r.rightsLeftToday === 'number' && !isDemo()) serverRightsLeft = r.rightsLeftToday;
    if (r.match) { matched = true; S.matches = [r.match, ...S.matches.filter(m => m.id !== r.match.id)]; save(); track('match', {from: feed.mode === 'passed' ? 'review' : 'feed'}); showMatch(r.match); }
  } catch (e) { toast(esc(e.message || "Couldn't save that. Check your internet.")); }
  if (!matched) afterSwipePrompts();
}
/* after the first swipe, once: ask for the photo (v2: the photo comes after the first swipe). After 5 swipes, once: invite them to add a line. */
function afterSwipePrompts() {
  setTimeout(() => {
    if (route !== 'app' || tab !== 'feed' || $('.sheet-bg', app) || $('.paired', app)) return;
    if (!myPhoto() && !S.photoAsked) { S.photoAsked = true; save(); track('photo_prompt'); return photosSheet({first: true}); }
    if (!S.lineAsked && myPhoto() && !S.profile.prompt && (S.feedSwipes || 0) >= 5) { S.lineAsked = true; save(); track('line_prompt'); lineSheet(true); }
  }, 420);
}

const storeUrl = () => /iPhone|iPad|iPod/.test(navigator.userAgent) ? CONFIG.APP_STORE : CONFIG.PLAY_STORE;
const meHasPicapool = () => !!S.user?.hasPicapool;
/* Chat on Picapool:
   1. you need a Picapool account first (your chats live in the app)
   2. they're on Picapool too → the chat is created
   3. they aren't yet → your message waits as a request: "Ananya is reviewing your message request" */
function chatFlow(m) {
  if (m.chatId) return openChat(m, null);
  if (!meHasPicapool()) return setupPicapool(m);
  if (m.chatRequest === 'sent') return requestPending(m);
  if (m.chatRequest === 'received') return requestReceived(m);
  composeSheet(m);
}

/* the first message, plus an optional plan: a night you share, a place, a time and a public meeting point */

async function openChat(m, opener, btn) {

  catch (e) { if (btn) btn.disabled = false; if (e.code === 'need_account') { S.user.hasPicapool = false; save(); closeSheet(); return setupPicapool(m); } return toast(esc(e.message)); }

  } else {

      <p class="p">${opener ? 'Your message is in the chat. ' : ''}Open Picapool, logged in with +91 ${fmtPhone(S.phone)}, and pick up the conversation there.</p>

}

async function askNumber(m) {

/* ---------- pairs: Paired (both picked) · Picked you (they picked me first) · You picked (waiting) ---------- */
let pairsTab = 'paired';
const PAIR_TABS = [['paired', 'Paired'], ['asked', 'Picked you'], ['sent', 'You picked']];
function renderPairsKeepSheet() { const sh = $('.sheet-bg', app); renderPairs(); if (sh) app.appendChild(sh); }
function renderPairs() {
  S.seenMatchIds = [...new Set([...S.seenMatchIds, ...S.matches.map(m => m.id)])]; save();
  const idOf = t => 'tab-' + t;
  app.innerHTML = `${demoFlag()}<section class="screen app">
    <header class="head"><h1>Pairs</h1></header>
    <div class="seg" role="tablist" aria-label="Pairs">${PAIR_TABS.map(([t, l]) => `<button role="tab" id="${idOf(t)}" aria-selected="${pairsTab === t}" aria-controls="pPanel" tabindex="${pairsTab === t ? 0 : -1}">${l}</button>`).join('')}</div>
    <div class="scroll pad" id="pPanel" role="tabpanel" aria-labelledby="${idOf(pairsTab)}">${pairsTab === 'paired' ? pairedHtml() : '<div class="spinner"></div>'}</div>
    ${tabsHtml()}</section>`;
  bindTabs();
  const order = PAIR_TABS.map(x => x[0]);
  const pick = t => { if (pairsTab === t) return; pairsTab = t; track('matches_tab', {tab: t}); renderPairs(); $('#' + idOf(t)).focus(); };
  order.forEach((t, i) => { const b = $('#' + idOf(t)); b.onclick = () => pick(t);
    b.onkeydown = e => { const k = {ArrowLeft: i - 1, ArrowRight: i + 1, Home: 0, End: order.length - 1}[e.key]; if (k === undefined) return; e.preventDefault(); pick(order[(k + order.length) % order.length]); }; });
  if (pairsTab === 'paired') bindPaired(); else if (pairsTab === 'asked') loadReceived(); else loadSent();
}
const bothLine = p => { const sh = sharedNights(p); return sh.length ? `<span class="both">${sh.map(n => `<i style="--c:${n.hex}"></i>`).join('')}Both going ${andList(sh.map(n => n.day))}</span>` : ''; };
const toDiscover = root => $$('[data-home]', root).forEach(b => b.onclick = () => { tab = 'feed'; go('app'); });
function pairedHtml() {
  if (!S.matches.length) return `<div class="nothing">No pairs yet. When someone you picked picks you back, they show up here.<button class="btn" data-home>Find people</button></div>`;
  return `${CONFIG.CHAT_ENABLED ? `<p class="hint">${IC.lock} ${CHAT_WHY}</p>` : ''}${S.matches.map(m => { const p = m.person;
    const chatLabel = m.chatId ? 'Open chat' : m.chatRequest === 'sent' ? 'Request sent' : m.chatRequest === 'received' ? 'Read message' : 'Say hi';
    const note = !m.chatId && m.chatRequest === 'sent' ? `<p class="status">${esc(p.name)} is reviewing your message request</p>`
      : !m.chatId && m.chatRequest === 'received' ? '<p class="status">Sent you a message request</p>' : m.chatId ? '<p class="status mute">Chat open on Picapool</p>' : '';
    const num = m.numberStatus === 'shared' ? `<a class="sb" href="https://wa.me/91${esc(m.phone)}" target="_blank" rel="noopener">+91 ${esc(fmtPhone(m.phone))}</a>`
      : m.numberStatus === 'waiting' ? '<span class="status" style="align-self:center;margin:0">Number shared · waiting for them</span>' : '';
    const acts = CONFIG.CHAT_ENABLED
      ? `<button class="sb ${m.chatRequest === 'sent' && !m.chatId ? '' : 'pri'}" data-chat="${esc(m.id)}">${chatLabel}</button>${num || `<button class="sb" data-num="${esc(m.id)}">Swap numbers</button>`}`
      : (num || `<button class="sb pri" data-num="${esc(m.id)}">Swap numbers</button>`);
    return `<div class="row">${photoOr(p.photos?.[0])}<div class="m"><b>${esc(p.name)}</b><small>${esc(p.college)}</small>${bothLine(p)}${note}<div class="acts">${acts}</div></div>
      <button class="rmore" data-rep="${esc(p.id)}" aria-label="Report or block ${esc(p.name)}">${IC.more}</button></div>`; }).join('')}`;
}
function bindPaired() {
  $$('[data-chat]').forEach(b => b.onclick = () => chatFlow(S.matches.find(x => x.id === b.dataset.chat)));
  $$('[data-num]').forEach(b => b.onclick = () => numberPrivacy(S.matches.find(m => m.id === b.dataset.num)));
  $$('[data-rep]').forEach(b => b.onclick = () => openReport(S.matches.find(m => m.person.id === b.dataset.rep).person));
  toDiscover(app);
}
async function loadReceived() {
  let r; try { r = await api.getReceivedLikes(); } catch (e) { if ($('#pPanel')) $('#pPanel').innerHTML = `<p class="nothing">${esc(e.message)}</p>`; return; }
  if (pairsTab !== 'asked' || !$('#pPanel')) return;
  const list = r.received || [];
  $('#pPanel').innerHTML = list.length
    ? `<p class="hint">They picked you. Pair up and you’re paired.</p>${list.map(({person: p, passed}) => `<div class="row">${photoOr(p.photos?.[0])}<div class="m"><b>${esc(p.name)}</b><small>${esc(p.college)}</small>${bothLine(p)}
        ${passed ? '<p class="status mute">You skipped them earlier</p>' : ''}
        <div class="acts"><button class="sb pri" data-lb="${esc(p.id)}">Pair up</button><button class="sb" data-nf="${esc(p.id)}">Not for me</button></div></div>
        <button class="rmore" data-rep="${esc(p.id)}" aria-label="Report or block ${esc(p.name)}">${IC.more}</button></div>`).join('')}`
    : `<div class="nothing">When someone picks you before you’ve picked them, they show up here.<button class="btn" data-home>Find people</button></div>`;
  track('likes_received_view', {n: list.length});
  toDiscover($('#pPanel'));
  $$('[data-lb]').forEach(b => b.onclick = () => likeBack(list.find(x => x.person.id === b.dataset.lb).person, b));
  $$('[data-nf]').forEach(b => b.onclick = async () => { b.disabled = true; try { await api.dismissLike(b.dataset.nf); track('like_dismiss'); loadReceived(); } catch (e) { b.disabled = false; toast(esc(e.message)); } });
  $$('[data-rep]', $('#pPanel')).forEach(b => b.onclick = () => openReport(list.find(x => x.person.id === b.dataset.rep).person));
}
async function likeBack(p, btn) {
  if (rightsLeft() <= 0) return limitSheet();
  btn.disabled = true;
  let r; try { r = await api.swipe(p.id, 'right'); } catch (e) { btn.disabled = false; return toast(esc(e.message)); }
  S.swipes[p.id] = {dir: 'right', at: Date.now(), retried: !!S.swipes[p.id]}; S.rightsByDay[todayISO()] = (S.rightsByDay[todayISO()] || 0) + 1;
  if (typeof r.rightsLeftToday === 'number' && !isDemo()) serverRightsLeft = r.rightsLeftToday;
  feed.queue = feed.queue.filter(x => x.id !== p.id); save(); track('like_back');

async function loadSent() {
  let r; try { r = await api.getSentLikes(); } catch (e) { if ($('#pPanel')) $('#pPanel').innerHTML = `<p class="nothing">${esc(e.message)}</p>`; return; }
  if (pairsTab !== 'sent' || !$('#pPanel')) return;

    ? `<p class="hint">Waiting for them to pick you too. If they do, they move to Paired.</p>${list.map(({person: p}) => `<div class="row" style="align-items:center">${photoOr(p.photos?.[0])}<div class="m"><b>${esc(p.name)}</b><small>${esc(p.college)}</small>${bothLine(p)}</div></div>`).join('')}`
    : `<div class="nothing">People you pick show up here until they pick you back.<button class="btn" data-home>Find people</button></div>`;
  toDiscover($('#pPanel'));
}

/* ---------- board: Garba Queen / Garba King, tonight and all of Navratri. No public counts. ---------- */

  lb.board ??= myBoardKey();
  app.innerHTML = `${demoFlag()}<section class="screen app">

    <div class="scroll pad">
      <div class="seg" role="group" aria-label="When" style="margin:0"><button data-p="tonight" aria-pressed="${lb.period === 'tonight'}">Tonight · ${esc(tonight().colour)}</button><button data-p="week" aria-pressed="${lb.period === 'week'}">All of Navratri</button></div>
      <div id="lbBody"><div class="spinner"></div></div>
    </div>

  bindTabs();

  const want = lb.board + lb.period;
  let r; try { r = await api.getLeaderboard(lb.board, lb.period); } catch (e) { if ($('#lbBody')) $('#lbBody').innerHTML = `<p class="nothing">${esc(e.message)}</p>`; return; }
  if (!$('#lbBody') || want !== lb.board + lb.period) return;

  const top = r.top || [];
  const pod = (p, rk) => p ? `<div class="pod p${rk}"><span class="cr">${rk === 1 ? IC.crown : ''}</span><div class="av"><img src="${esc(p.photo)}" alt=""></div><b>${esc(p.name)}</b><small>${esc(shortCollege(p.college))}</small><div class="base">${rk}</div></div>` : '<div></div>';
  const mine = (S.user.gender === 'female') === (lb.board === 'queen');
  $('#lbBody').innerHTML = (top.length ? `<div class="podium">${pod(top[1], 2)}${pod(top[0], 1)}${pod(top[2], 3)}</div>
      ${top.slice(3).map((p, i) => `<div class="rk"><span class="n">${i + 4}</span><img src="${esc(p.photo)}" alt=""><span style="min-width:0"><b>${esc(p.name)}</b><small>${esc(p.college)}</small></span>${p.isMe ? '<span class="you">YOU</span>' : ''}</div>`).join('')}`

  $('#shareRank') && ($('#shareRank').onclick = () => openShare('rank', r.me.rank, lb.period));
}
function myBoardCard(me) {
  if (!S.profile.inBoard) return `<div class="mine"><b>You’re not in the race.</b><p>The top ${CONFIG.BOARD_SIZE} are crowned every night.</p><button class="btn" id="joinLb">Put me in</button></div>`;
  if (!myPhoto()) return `<div class="mine"><b>Add a photo to join the race.</b><p>Only passes with a photo can be crowned.</p></div>`;
  if (!me) return '';
  return `<div class="mine"><b>${me.rank ? `You’re #${me.rank}.` : `Not in the top ${CONFIG.BOARD_SIZE} yet.`}</b>

async function setBoard(v) {

  if (tab === 'board') renderBoard();
}
async function setPaused(v) {
  try { await api.setPaused(v); S.profile.paused = v; save(); track('pause', {v}); toast(v ? 'Your pass is paused. Pairs and chats stay.' : 'You’re back. People can see your pass again.'); }
  catch (e) { toast(esc(e.message)); const t = $('#pauseT'); if (t) t.checked = !v; return; }
  if (route === 'app') go('app');
}

/* ---------- photos: up to 5, several at once, the first is the main photo ---------- */
function photosSheet({first = false} = {}) {
  let photos = [...(S.profile.photos || [])];
  const paint = s => {
    const n = photos.length;
    $('#slots', s).innerHTML = Array.from({length: CONFIG.MAX_PHOTOS}, (_, i) => photos[i]
      ? `<div class="slot filled${i ? '' : ' main'}" role="group" aria-label="Photo ${i + 1}${i ? '' : ', main photo'}" style="background-image:url('${esc(photos[i])}')"><button class="x" data-rm="${i}" aria-label="Remove photo ${i + 1}">×</button>${i ? `<button class="tag2" data-main="${i}" aria-label="Make photo ${i + 1} the main photo">Make main</button>` : '<span class="tag2">Main</span>'}</div>`
      : `<label class="slot${i ? '' : ' main'}" for="pf" aria-label="Add photos">${IC.plus}</label>`).join('');
    $('#psave', s).disabled = !n;
    $$('[data-rm]', s).forEach(b => b.onclick = e => { e.preventDefault(); photos.splice(+b.dataset.rm, 1); paint(s); });
    $$('[data-main]', s).forEach(b => b.onclick = () => { photos.unshift(...photos.splice(+b.dataset.main, 1)); paint(s); });
  };
  sheet(`<h2>${first ? 'Add your photo<em>so they can see you too.</em>' : 'Your photos'}</h2>
    <p class="p">${first ? 'Nobody can see your pass until you add one. One clear photo of your face is all it takes.' : `Up to ${CONFIG.MAX_PHOTOS}. The main photo is the one people see first.`}</p>
    <div class="photos" id="slots"></div>
    <input type="file" id="pf" class="file-input" accept="image/*" multiple aria-label="Add photos">
    <p class="err" id="perr" role="alert"></p>
    <button class="btn" id="psave" disabled>${first ? 'Done' : 'Save photos'}</button>
    ${isDemo() ? '<button class="text-btn" id="psam">Use a sample photo (demo)</button>' : `<button class="text-btn" id="pno">${first ? 'Later' : 'Cancel'}</button>`}`, s => {
    paint(s);
    $('#pf', s).onchange = async e => {
      const files = [...(e.target.files || [])]; e.target.value = ''; if (!files.length) return;
      const room = CONFIG.MAX_PHOTOS - photos.length, err = $('#perr', s);
      if (room <= 0) { err.textContent = `You already have ${CONFIG.MAX_PHOTOS} photos. Remove one to add another.`; return; }
      err.style.color = 'var(--muted)'; err.textContent = files.length > 1 ? 'Adding photos…' : 'Adding photo…';
      let failed = 0;
      for (const f of files.slice(0, room)) { try { photos.push(await cropImage(f, 720, 900)); } catch (x) { failed++; } }
      err.style.color = ''; err.textContent = [failed ? `${failed} photo${failed > 1 ? 's' : ''} couldn’t be read. Try JPG or PNG.` : '', files.length > room ? `Only ${CONFIG.MAX_PHOTOS} photos fit.` : ''].filter(Boolean).join(' ');
      paint(s);
    };
    $('#psam', s) && ($('#psam', s).onclick = () => { photos.push(ME_SAMPLE[S.user.gender] || ME_SAMPLE.male); paint(s); });
    $('#pno', s) && ($('#pno', s).onclick = () => closeSheet());
    $('#psave', s).onclick = async () => {
      const b = $('#psave', s); b.disabled = true; b.textContent = 'Saving…';
      const had = !!myPhoto();
      try { const r = await api.saveProfile({...profilePayload(), photos}); S.profile = r.profile; save(); track('photos_done', {count: photos.length, first: !had}); closeSheet();
        toast(had ? 'Saved' : `${IC.check} Your pass is live. People can see you now.`); if (route === 'app') go('app'); }

}
const profilePayload = () => { const p = S.profile; return {photos: p.photos || [], nights: p.nights, venue: p.venue || null, prompt: p.prompt || null, inBoard: !!p.inBoard}; };
function cropImage(file, W, H) {
  return new Promise((res, rej) => {
    if (file.size > 25e6) return rej(new Error('That photo is too big. Pick one under 25 MB.'));
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      try {
        const ratio = W / H, ir = img.naturalWidth / img.naturalHeight;
        let sw = img.naturalWidth, sh = img.naturalHeight, sx = 0, sy = 0;
        if (ir > ratio) { sw = sh * ratio; sx = (img.naturalWidth - sw) / 2; } else { sh = sw / ratio; sy = (img.naturalHeight - sh) / 2.6; }
        const c = document.createElement('canvas'); c.width = W; c.height = H;
        const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
        URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.8));

}

/* ---------- sheets ---------- */
function modalA11y(dlg, prev, onEsc) {

  const focusables = () => [...dlg.querySelectorAll('button:not([disabled]),a[href],input:not([type=hidden]):not(.file-input),select,textarea,label[for]')].filter(e => e.offsetParent !== null);
  dlg._esc = onEsc; dlg._focusables = focusables;
  setTimeout(() => { const f = dlg.querySelector('[data-autofocus]') || focusables()[0]; if (f && dlg.isConnected) f.focus({preventScroll: true}); }, 60);
}
/* one listener for the topmost dialog: Escape closes it, Tab stays inside it */
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' && e.key !== 'Tab') return;
  const dlg = [...document.querySelectorAll('[aria-modal=true]')].pop(); if (!dlg) return;
  if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); const prev = dlg._prev; dlg._esc(); setTimeout(() => { if (!dlg.isConnected && (document.activeElement === document.body || !document.activeElement)) focusBack(prev); }, 80); return; }
  const fs = dlg._focusables(); if (!fs.length) return;
  const i = fs.indexOf(document.activeElement);
  if (i === -1) { e.preventDefault(); fs[e.shiftKey ? fs.length - 1 : 0].focus(); }
  else if (e.shiftKey && i === 0) { e.preventDefault(); fs[fs.length - 1].focus(); }
  else if (!e.shiftKey && i === fs.length - 1) { e.preventDefault(); fs[0].focus(); }
}, true);
function sheet(html, bind) {
  closeSheet(true);
  const prev = document.activeElement;
  const bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.innerHTML = `<div class="sheet" role="dialog"><div class="grab" aria-hidden="true"></div>${html}</div>`;
  bg.onclick = e => { if (e.target === bg) closeSheet(); };
  app.appendChild(bg); bind && bind(bg);
  modalA11y(bg.firstElementChild, prev, () => closeSheet());
  return bg;
}
function focusBack(p) {
  const t = p && p.isConnected && p !== document.body ? p : $('#yep:not([disabled]), .head h1, .title', app);
  if (t) { try { if (!t.matches('button,a,input,select,textarea')) t.tabIndex = -1; t.focus({preventScroll: true}); } catch (e) {} }
}
function closeSheet(instant) { $$('.sheet-bg', app).forEach(x => { const p = x.firstElementChild?._prev; x.remove(); if (!instant) focusBack(p); }); }
function openReport(p) {
  const reasons = ['Fake profile', 'Inappropriate photo', 'Looks under 18', 'Rude or harassing', 'Something else'];
  sheet(`<h2>Report or block<em>${esc(p.name)}</em></h2><p class="p">They won’t know. The Picapool team checks every report. If you’re in danger, call 112 first.</p>
    <div class="choices list">${reasons.map((r, i) => `<button class="choice" style="--i:${i}" data-r="${r}"><span><strong>${r}</strong></span></button>`).join('')}</div>
    <button class="text-btn" id="justBlock" style="margin-top:8px">Just block, don’t report</button>`, s => {
    const done = async reason => {
      try { reason ? await api.report(p.id, reason) : await api.block(p.id); } catch (e) {}
      S.blocked.push(p.id); feed.queue = feed.queue.filter(x => x.id !== p.id); S.matches = S.matches.filter(m => m.person.id !== p.id); save(); track(reason ? 'report' : 'block', {reason});
      closeSheet(); if (route === 'app' && tab === 'feed') drawDeck(); else if (route === 'app' && tab === 'pairs') renderPairs();

/* =====================================================================
   SHARING: the invite link first (works everywhere), a story poster second
   ===================================================================== */
function shareText(kind, rank, period) {
  const ns = (S.profile?.nights || []).map(nightById).filter(n => n && n.date >= todayISO());
  if (kind === 'rank') { const n = tonight(); return `👑 #${rank} ${boardFor(S.user.gender)} ${period === 'tonight' ? `tonight (${n.colour.toLowerCase()} night)` : 'of Navratri'}\n${S.user.firstName}, ${S.user.college}\n\nSee who’s going: ${shareLink()}`; }
  return `Going to garba on ${ns.map(n => n.day).join(', ') || 'Navratri'}. See who from North Campus is going on your nights:\n\n${shareLink()}`;
}
const canShareLink = () => { try { return TOP && !!navigator.share; } catch (e) { return false; } };
function copyLink(link, where, onDone) {
  const fallback = () => { where.innerHTML = `<div class="sharetext">${esc(link)}</div>`; const r = document.createRange(); r.selectNodeContents(where.firstElementChild); const g = getSelection(); g.removeAllRanges(); g.addRange(r); toast('Link selected. Tap Copy.'); };
  if (!canClipboard()) return fallback();
  try { navigator.clipboard.writeText(link).then(onDone, fallback); } catch (e) { fallback(); }
}
async function posterInto(s, kind, rank, period, text, cls) {
  try {
    if (!myPhoto()) throw new Error('no photo');
    const c = await makeShareCard(kind, rank, period);
    const blob = await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/png'));
    if (!document.body.contains(s)) return;
    const file = new File([blob], kind === 'rank' ? 'picapool-crown.png' : 'picapool-dandiya.png', {type: 'image/png'});
    const url = URL.createObjectURL(blob);
    const canFile = !!(navigator.canShare && (() => { try { return navigator.canShare({files: [file]}); } catch (e) { return false; } })());
    $('#shWrap', s).innerHTML = `<img class="poster" src="${url}" alt="${kind === 'rank' ? 'Your crown poster' : 'Your Dandiya pass poster'}">`;
    $('#shMain', s).innerHTML = canFile ? `<button class="${cls}" id="shStory">Post to story</button>`
      : TOP ? `<a class="${cls}" href="${url}" download="${file.name}" id="shSave">Save image</a>`
      : '<p class="note" style="margin:0 0 12px">Long-press the image to save it.</p>';
    $('#shStory', s) && ($('#shStory', s).onclick = async () => { try { await navigator.share({files: [file], text: kind === 'rank' ? '' : text}); track('share', {kind, via: 'story'}); } catch (e) {} });
    $('#shSave', s) && ($('#shSave', s).onclick = () => track('share', {kind, via: 'save'}));
  } catch (e) { if (document.body.contains(s)) $('#shWrap', s).innerHTML = `<p class="note" style="margin:0 0 8px">${myPhoto() ? 'Couldn’t make the image here. Share the link instead.' : 'Add a photo to make a story poster.'}</p>`; }
}
async function openShare(kind, rank, period) {
  if (kind !== 'rank') return openInvite();
  period = period || 'tonight'; track('share_open', {kind});
  const text = shareText(kind, rank, period);
  const s = sheet(`<h2>Flaunt<em>your crown.</em></h2>
    <div id="shWrap"><div class="spinner"></div></div><div id="shMain"></div>
    <a class="btn wa" id="shWa" href="https://wa.me/?text=${encodeURIComponent(text)}" target="_blank" rel="noopener">${IC.wa} Send on WhatsApp</a>
    <div id="lkSel"></div><button class="btn light" id="shLink">Copy link</button>`);
  $('#shWa', s).onclick = () => track('share', {kind, via: 'wa_text'});
  $('#shLink', s).onclick = () => copyLink(shareLink(), $('#lkSel', s), () => { toast('Link copied. On Instagram, add it with the Link sticker.'); track('share', {kind, via: 'copy_link'}); });
  posterInto(s, 'rank', rank, period, text, 'btn gold');
}
async function openInvite() {
  track('share_open', {kind: 'partner'});
  const link = shareLink(), text = shareText('partner');
  const s = sheet(`<h2>Bring your<em>friends along.</em></h2>
    <p class="p" style="margin-bottom:12px">Friends who join from your link can find their dandiya partners too.</p>
    <div class="linkbox">${esc(link.replace(/^https?:\/\//, ''))}</div><div id="lkSel"></div>
    ${canShareLink() ? `<button class="btn" id="shInvite">${IC.share} Share invite link</button><button class="btn light" id="shLink">Copy invite link</button>` : `<button class="btn" id="shLink">Copy invite link</button>`}
    <a class="btn wa" id="shWa" href="https://wa.me/?text=${encodeURIComponent(text)}" target="_blank" rel="noopener" style="margin-top:8px">${IC.wa} Send on WhatsApp</a>
    <div class="divider">Or post a story</div>
    <div id="shWrap"><div class="spinner"></div></div><div id="shMain"></div>`);
  $('#shInvite', s) && ($('#shInvite', s).onclick = async () => { try { await navigator.share({title: CONFIG.PRODUCT, text: text.replace(link, '').trim(), url: link}); track('share', {kind: 'partner', via: 'invite_link'}); } catch (e) {} });
  $('#shLink', s).onclick = () => copyLink(link, $('#lkSel', s), () => { toast('Invite link copied'); track('share', {kind: 'partner', via: 'copy_link'}); });
  $('#shWa', s).onclick = () => track('share', {kind: 'partner', via: 'wa_text'});
